[project]
name = "fuzer"
version = "0.1.0"
description = "Entity resolution, entity linking and asset graph service for oil & gas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "msal>=1.31,<2",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "mcp>=2.3",
    "anthropic>=2.3",
    "pillow>=12.3,<14",
    "pypdf>=6.20,<6.22",
    "python-dotenv>=1.2",
    "pyarrow>=25.0,<26",
    # The operations assistant (fuzer ask / chat, the Ask page): Microsoft Agent Framework on Claude.
    "agent-framework-core==1.23.0",
    "agent-framework-anthropic==1.0.0b261022",
    # Scheduled loads, rebuilds and Claude reading (fuzer jobs).
    "dagster==1.13.26",
    "dagster-webserver==1.13.26",
    # Embedded Postgres for local runs when FUZER_DATABASE_URL is not set.
    "pgserver>=0.1.4",
    # Delta Lake tables in the lake connector.
    "deltalake>=1.6.6,<1.7",
    # Coupled synthetic process values (process_model.py).
    "numpy>=2.0",
    # Chart images for the assistant to look at (look_at_figure).
    "matplotlib>=3.10,<4",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
openai = [
    "agent-framework-openai==1.17.0",
    "openai>=2.25,<4",
]

[project.scripts]
fuzer = "fuzer.cli:main"

[dependency-groups]
# SpiffWorkflow is only the reference the work engine's behaviour is tested against (tests/workflow/test_workflow.py).
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fuzer-fakeplant",
    "spiffworkflow>=3.2.0",
    "import-linter>=2.1",
    "pytest-xdist>=3.6",
    "pytest-randomly>=3.15",
]
docs = [
    "mkdocs-material>=9.8.0",
]

[tool.uv]
# agent-framework-anthropic still declares anthropic<2; it runs on the 2.x SDK Fuzer uses (tests/agents/test_agents.py).
override-dependencies = ["anthropic>=2.3"]

[tool.uv.workspace]
members = ["fakeplant"]

[tool.uv.sources]
fuzer-fakeplant = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The e2e tier (week-long replays and evals, minutes each) runs only when asked: pytest -m e2e. A later -m wins.
addopts = "-m 'not e2e'"
# Tiers (#137), set by tests/conftest.py from what each test uses: `pytest -m unit` for the quick ones.
markers = [
    "unit: pure functions on small in-memory inputs; no Postgres, no generated plant",
    "integration: reads or writes a database (a shared plant copy or its own)",
    "e2e: replays and evals over weeks of a plant",
    "sequence: a module whose tests are steps of one story, run in file order (the module still runs anywhere)",
]

[tool.importlinter]
root_package = "fuzer"

[[tool.importlinter.contracts]]
name = "Layers (#135): a module imports only from its own layer and the ones below"
type = "layers"
containers = ["fuzer"]
exhaustive = true
# Existing root utilities are not domain layers: source introspection, generated docs and data paths.
exhaustive_ignores = ["components", "reference", "resources"]
layers = [
    "cli",
    "api | evals",
    "agents",
    "ops : plots",
    "analysis",
    "graph",
    "sources",
    "workflow",
    "core",
]
ignore_imports = [
    # The SRE hand-off's default diagnosis asks the troubleshooter at run time; callers can pass their own `ask`.
    "fuzer.ops.sre_handoff -> fuzer.agents",
]
