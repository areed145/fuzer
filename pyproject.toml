[project]
name = "fuzer"
version = "0.1.0"
description = "Entity resolution, entity linking and asset graph service for oil & gas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "mcp>=2.3",
    "anthropic>=2.3",
    "pillow>=12.3,<13",
    "pypdf>=6.20,<6.21",
    "python-dotenv>=1.2",
    "pyarrow>=25.0,<26",
]

[project.optional-dependencies]
# Embedded Postgres for local runs when FUZER_DATABASE_URL is not set.
local = ["pgserver>=0.1.4"]
# Delta Lake tables in the lake connector (plain Parquet needs only pyarrow).
delta = ["deltalake>=1.6.6,<1.7"]
jobs = [
    "dagster==1.13.26",
    "dagster-webserver==1.13.26",
]

[project.scripts]
fuzer = "fuzer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pgserver>=0.1.4", "fuzer-fakeplant"]

[tool.uv.workspace]
members = ["fakeplant"]

[tool.uv.sources]
fuzer-fakeplant = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fuzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
