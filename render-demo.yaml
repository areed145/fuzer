services:
  - type: web
    name: fuzer-okan-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    plan: 0.5c-512mb
    healthCheckPath: /health
    envVars:
      - key: FUZER_DATABASE_URL
        fromDatabase:
          name: fuzer-okan-demo-db
          property: connectionString

databases:
  - name: fuzer-okan-demo-db
    databaseName: fuzer_okan_demo
    user: fuzer
    plan: 0.1c-256mb
    postgresMajorVersion: 16
