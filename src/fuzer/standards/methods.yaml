# The method registry (P1.3): every calculation an agent or a detector can call, as data.
#
# Each method names the standard behind it (or, where no published standard applies, the engineering practice it
# follows), its inputs with units, where it is valid, the data it needs before it answers, the thresholds it
# flags at, and at least one test vector with a known answer:
#   kernel: a pure function (module:function) with literal arguments and the answer worked by hand
#   worked: a test that runs the method on the fake plant's injected story
# Standards are cited as the code applies them; verify clauses against your licensed copy before relying on one.
# `thresholds` carry `code` (module:CONSTANT) where the calculation reads the same number, so a test keeps the two
# equal (`scale` and `index` where the code holds a fraction or a pair). A method the agents reach through a tool
# of its own, not `calc`, names it under `tool`. docs/methods.md is generated from this file; tests/analysis/test_methods.py checks every entry.

decline:
  title: Latest well test against the Arps decline
  standard: "Arps, Analysis of Decline Curves (1945)"
  inputs: [{name: Well tests (oil rate, or gas rate on a gas well), unit: Sm³/d or kSm³/d}]
  valid: Wells on natural or artificial lift with a declining rate; the fit restarts after a step change. A well whose tests carry no oil is fitted on its gas rate.
  needs: At least four well tests.
  vectors:
    - kernel: fuzer.analysis.calcs:arps
      args: [[0, 1, 2, 3, 4], [100.0, 81.873075, 67.032005, 54.881164, 44.932896], exponential]
      expect: {model: exponential, qi: 100.0, D: 0.2, b: 0.0}
      says: A rate of 100 falling 20 % a year, sampled yearly, fits back to qi 100 and D 0.2.

gas_lift:
  title: Lift gas against the economic optimum of the well's lift curve
  practice: Gas lift performance curve fitted to the well's own tests; the optimum is where one more unit of gas gains the breakeven oil.
  inputs: [{name: Well tests (oil rate), unit: Sm³/d}, {name: Lift gas rate, unit: kSm³/d}]
  valid: Gas lifted wells with tests at three or more distinct gas rates.
  needs: At least four well tests with a lift gas rate.
  thresholds:
    lifting_mostly_water: {value: 70, unit: "%", means: "Water cut at which lift gas is mostly lifting water.", code: "fuzer.graph.operations:MOSTLY_WATER"}
  vectors: [{worked: "tests/analysis/test_calcs.py::test_checks_flag_the_okan_stories_as_of_then"}]

pump_curve:
  title: Pump head against the OEM curve at the same flow
  practice: Differential head from suction and discharge pressure compared with the manufacturer's head curve.
  inputs: [{name: Flow, unit: m³/h}, {name: Suction and discharge pressure, unit: barg}, {name: OEM head curve, unit: m}]
  valid: Centrifugal pumps with an accepted OEM curve, while running.
  needs: A minimum count of running readings in the recent window.
  thresholds:
    head_loss: {value: 5, unit: "%", means: "Head this far below the OEM curve at the same flow.", code: "fuzer.analysis.calcs:HEAD_LOSS_PCT"}
  vectors: [{worked: "tests/analysis/test_calcs.py::test_checks_flag_the_okan_stories_as_of_then"}]

choke:
  title: Choke effective Cv against its characteristic
  practice: Effective flow coefficient from the tested rate and pressure drop, as a ratio to the trim's characteristic at the same opening.
  inputs: [{name: Choke opening, unit: "%"}, {name: Upstream and downstream pressure, unit: barg}, {name: Well test rates, unit: Sm³/d}]
  valid: Production chokes with a characteristic on record.
  needs: Three or more readings since the trim was last replaced, else the latest readings before.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_checks_flag_the_okan_stories_as_of_then"}]

reliability:
  title: Weibull and Crow-AMSAA on the failure history
  standard: "IEC 61649 (Weibull analysis); IEC 61164 (reliability growth, power law)"
  inputs: [{name: Failure notifications, unit: dates}]
  valid: Repairable units or a class of them with repeat failures.
  needs: Three times between failures for Weibull; four failures for Crow-AMSAA.
  vectors:
    - kernel: fuzer.analysis.calcs:weibull
      args: [[37.2608, 61.4871, 83.2555, 107.5068, 142.9361]]
      expect: {beta: 2.0, eta: 100.0}
      says: Five times placed exactly on the median-rank line of a Weibull with beta 2 and eta 100 fit back to it.
    - kernel: fuzer.analysis.calcs:crow_amsaa
      args: [[2000-01-01, 2001-02-04, 2002-06-19, 2004-05-19, 2006-11-05]]
      expect: {beta: 0.5, lam: 0.1}
      says: Failures at 400, 900, 1600 and 2500 days after the first follow N = 0.1 t^0.5 exactly.

pm_interval:
  title: Preventive maintenance interval against the class's failure pattern
  standard: "IEC 61649 (Weibull analysis); IEC 60300-3-11 (reliability centred maintenance)"
  inputs: [{name: Failure notifications on the class's units, unit: dates}, {name: Preventive plan intervals, unit: days}]
  valid: Equipment classes with preventive plans and repeat failures. Inspection plans are left out; a statutory interval is never proposed for change.
  needs: Three times between failures in the class, else the class is reported as insufficient.
  vectors:
    - kernel: fuzer.analysis.calcs:pm_pattern
      args: [[100, 200, 300], 2.0, 200.0]
      expect: {interval_days: 200, fails_first_pct: 63.2121, flag: null}
      says: A wear-out class (beta 2) on a 200-day median interval at its characteristic life loses 1 - e^-1 of its units first.
    - kernel: fuzer.analysis.calcs:pm_pattern
      args: [[365], 1.0, 400.0]
      expect: {interval_days: 365, flag: random_failures}
      says: With beta 1 failures are random in time, so a fixed interval cannot prevent them.
    - kernel: fuzer.analysis.calcs:pm_pattern
      args: [[180, 400, 420], 3.0, 300.0]
      expect: {interval_days: 400, flag: interval_too_long}
      says: A wear-out class serviced past its characteristic life fails before its PM.

spares_coverage:
  title: Critical spares coverage, ranked by criticality and failure history
  standard: "ISO 14224 (equipment and failure data); ISO 55000 (criticality-based asset management)"
  inputs: [{name: Bill of materials of each unit's installed equipment, unit: materials}, {name: Stock on hand, unit: each}, {name: Criticality (A, B, C), unit: class}, {name: Failure notifications, unit: count}]
  valid: Tagged units whose equipment carries a bill of materials. A unit with none is unknown, never covered; minimum stock and lead times are not in the records, so covered means one or more on the shelf.
  needs: A bill of materials on the unit's installed equipment.
  vectors:
    - kernel: fuzer.analysis.spares:rank
      args: [[{unit: P-2, status: covered, criticality: A, failures: 9}, {unit: P-1, status: uncovered, criticality: B, failures: 1}, {unit: K-1, status: uncovered, criticality: A, failures: 2}, {unit: V-1, status: unknown, criticality: A, failures: 0}]]
      expect: [{unit: K-1, status: uncovered, criticality: A, failures: 2}, {unit: P-1, status: uncovered, criticality: B, failures: 1}, {unit: V-1, status: unknown, criticality: A, failures: 0}, {unit: P-2, status: covered, criticality: A, failures: 9}]
      says: A-critical stock-outs come first, then other stock-outs, then units nobody can check, then covered ones.

wall_loss:
  title: Wall loss rate and remaining life per CML
  standard: "API 570 / API 510"
  inputs: [{name: Wall thickness readings per CML, unit: mm}, {name: Minimum required thickness, unit: mm}]
  valid: Vessels, piping and pipelines with repeat thickness surveys at the same locations.
  needs: Wall thickness readings on the item.
  vectors:
    - kernel: fuzer.analysis.calcs:remaining_life
      args: [8.0, -0.5, 5.0]
      expect: 6.0
      says: 8.0 mm losing 0.5 mm a year reaches a 5.0 mm minimum in 6 years.

corrosion_circuit:
  title: "Corrosion circuit: long and short term rate, remaining life, next inspection"
  standard: "API 570"
  clause: "7.1"
  inputs: [{name: Wall thickness readings per CML, unit: mm}, {name: Maximum operating pressure, unit: barg}, {name: Nominal diameter, unit: in}]
  valid: In-service lines of one service. The retirement thickness is the Barlow pressure design thickness (ASME B31.4 / B31.8) on an assumed API 5L X52 grade unless one is given.
  needs: Wall thickness readings on a line of the circuit.
  thresholds:
    retire_soon: {value: 5, unit: "years", means: "Remaining life under this goes to the integrity engineer now.", code: "fuzer.analysis.integrity:RETIRE_YEARS"}
    longest_interval: {value: 10, unit: "years", means: "The next inspection is at half the remaining life, at most this long after the last survey.", code: "fuzer.analysis.integrity:MAX_INTERVAL"}
  vectors:
    - kernel: fuzer.analysis.integrity:cml_rate
      args: [[{at: "2015-01-01", value: 10.0}, {at: "2020-01-01", value: 9.0}, {at: "2021-01-01", value: 8.6}]]
      expect: {long_term: 0.23328, short_term: 0.39918, governing: 0.39918}
      says: 1.4 mm lost over six years is 0.233 mm/year long term; 0.4 mm in the last year governs.
    - kernel: fuzer.analysis.integrity:design_thickness
      args: [100.0, 12]
      expect: 6.2655
      says: "Barlow at 100 barg on 323.9 mm OD, X52 at a 0.72 design factor: 10 x 323.9 / (2 x 359 x 0.72)."

well_constraint:
  title: What limits a well (choke, back-pressure or lift)
  practice: Critical or subcritical choke flow from the pressure ratio across the choke, with the header pressure and the lift curve.
  inputs: [{name: Wellhead and header pressure, unit: barg}, {name: Choke opening, unit: "%"}]
  valid: Producing wells with a wellhead pressure and their jacket's header pressure.
  needs: A production header pressure for the well's jacket.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

dp_drift:
  title: Wellhead-to-header pressure drop drift
  practice: Trend of the flowline pressure drop between well tests; a sustained rise is a restriction building.
  inputs: [{name: Wellhead and header pressure, unit: barg}]
  valid: Producing wells over a window with no choke move or reroute.
  needs: A production header pressure for the well's jacket.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

compressor_performance:
  title: Compressor stage polytropic efficiency and head
  practice: Polytropic efficiency from suction and discharge pressure and temperature on ideal-gas properties, the last days against the window's first week.
  inputs: [{name: Suction and discharge pressure, unit: barg}, {name: Suction and discharge temperature, unit: "°C"}]
  valid: Compressor stages with all four measurements, while running. Use gas_performance where real-gas properties matter.
  needs: A suction temperature for the stage and enough running time in the window.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

cooler_fouling:
  title: Cooler outlet temperature against its clean baseline
  practice: Rise of the outlet temperature above the level after the last cleaning, and when it reaches the high limit at that rate.
  inputs: [{name: Outlet temperature, unit: "°C"}]
  valid: Coolers with an outlet temperature point and steady duty.
  needs: At least 14 days of outlet temperature.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

peers:
  title: Units of a class side by side
  practice: Failures per year, MTBF, oil lost and vibration per unit, with outliers by robust z-score from the class median.
  inputs: [{name: Failure notifications, unit: dates}, {name: Vibration, unit: mm/s}]
  valid: Equipment classes or models with several installed units.
  needs: At least three units to compare.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

vibration:
  title: Overall vibration against the evaluation zones
  standard: "ISO 20816-3 (formerly ISO 10816-3); ISO 20816-8 for reciprocating compressors"
  inputs: [{name: Overall vibration velocity, unit: mm/s RMS}]
  valid: "Group 1 (300 kW to 50 MW) and group 2 (15 to 300 kW) machines on rigid or flexible foundations, while running."
  needs: A vibration point in mm/s with enough readings in the window.
  vectors:
    - kernel: fuzer.analysis.rotating:zone_of
      args: [5.0, [2.3, 4.5, 7.1]]
      expect: C
      says: 5.0 mm/s on a group 1 machine on a rigid foundation is between 4.5 and 7.1, which is zone C.

pump_bep:
  title: Pump operating region against best efficiency point
  standard: "API 610 (preferred and allowable operating regions)"
  inputs: [{name: Flow, unit: m³/h}, {name: OEM curve with best efficiency point, unit: m³/h}]
  valid: Centrifugal pumps whose OEM curve gives a best efficiency point.
  needs: An OEM curve with a best efficiency point.
  thresholds:
    off_bep_low: {value: 70, unit: "%", means: "Below this share of best efficiency flow is outside the preferred region.", code: "fuzer.analysis.rotating:POR", scale: 100, index: 0}
    off_bep_high: {value: 120, unit: "%", means: "Above this share of best efficiency flow is outside the preferred region.", code: "fuzer.analysis.rotating:POR", scale: 100, index: 1}
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

surge:
  title: Compressor surge margin against the OEM map
  practice: Suction flow over the surge flow at the running speed from the manufacturer's map, with recycle valve duty and head against the map.
  inputs: [{name: Suction flow, unit: m³/h}, {name: Speed, unit: rpm}, {name: Anti-surge valve opening, unit: "%"}]
  valid: Centrifugal stages with an OEM map that gives a rated speed and design point.
  needs: An OEM map for the stage and enough running time in the window.
  thresholds:
    near_surge: {value: 5, unit: "%", means: "A fifth percentile surge margin under this is a surge risk.", code: "fuzer.analysis.rotating:NEAR_SURGE"}
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

surge_events:
  title: Surge events from their signature
  practice: A collapse of suction flow with the anti-surge valve snapping open in the same minutes, while the train runs.
  inputs: [{name: Suction flow, unit: m³/h}, {name: Anti-surge valve opening, unit: "%"}]
  valid: Centrifugal stages with a suction flow and an anti-surge valve position.
  needs: Suction flow and valve position over the window.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

heat_rate:
  title: Gas turbine heat rate against the OEM curves
  practice: Fuel energy per unit of output against the manufacturer's expected heat rate at the same load and ambient temperature.
  inputs: [{name: Fuel gas flow, unit: Sm³/h}, {name: Output power, unit: kW}, {name: Ambient temperature, unit: "°C"}]
  valid: Gas turbine drivers with OEM performance curves for the model.
  needs: OEM curves for the model and enough running time in the window.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

motor_load:
  title: Motor load against nameplate and service factor
  practice: Median running power as a share of the nameplate rating, with hours above the rating and above the service factor.
  inputs: [{name: Motor power, unit: kW}, {name: Nameplate rating, unit: kW}]
  valid: Electric motor driven machines with a power point.
  needs: A motor power point and enough running time in the window.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

rotating_health:
  title: Rotating machine health summary
  standard: "ISO 14224 (rotating classes); each check that applies cites its own standard"
  inputs: [{name: The inputs of every check that applies to the machine's class, unit: various}]
  valid: Any rotating machine. Checks whose inputs are missing are listed as not checked.
  needs: At least one check able to run on the machine.
  vectors: [{worked: "tests/analysis/test_condition.py::test_the_screen_raises_the_new_findings_with_their_remaining_life"}]

rod_load:
  title: Reciprocating compressor rod load and reversal
  standard: "API 618"
  inputs: [{name: Cylinder suction and discharge pressure, unit: barg}, {name: Rated rod load, unit: kN}]
  valid: Reciprocating compressors with cylinder geometry on record.
  needs: Cylinder pressures and enough running time in the window.
  vectors: [{worked: "tests/analysis/test_recip.py::test_a_leaking_second_stage_valve_pushes_first_stage_rod_load_past_the_rating"}]

valve_health:
  title: Reciprocating compressor valve health
  standard: "API 618"
  inputs: [{name: Cylinder discharge temperatures, unit: "°C"}, {name: Stage pressures, unit: barg}]
  valid: Reciprocating compressors with two or more cylinders on a stage.
  needs: Two cylinder discharge temperatures on the same stage and enough running time.
  vectors: [{worked: "tests/analysis/test_recip.py::test_the_leaking_cylinder_runs_hot_and_the_stage_ratios_shift"}]

compressor_trip:
  title: Trip diagnosis from the first point to move
  standard: "ISO 13379-1 (symptom to cause)"
  inputs: [{name: Run signal, unit: kW or rpm}, {name: Every point on the train, unit: various}, {name: Alarm and trip settings, unit: various}]
  valid: Compression and pump trains with a run signal. Each point is judged against its own hours before the trip.
  needs: A trip of the train in the two days before the time asked about.
  thresholds:
    inspect_first: {value: 30, unit: "days", means: "A second trip of the same family on the train within this: inspect, don't restart.", code: "fuzer.analysis.trips:REPEAT_DAYS"}
    review: {value: 45, unit: "days", means: "Any earlier trip on the train within this: ask reliability to review.", code: "fuzer.analysis.trips:REVIEW_DAYS"}
  vectors: [{worked: "tests/analysis/test_trips.py::test_train_b_tripped_on_the_bearing_vibration_it_showed_for_hours"}]

failed_starts:
  title: Failed start attempts
  practice: Starts that did not reach running within the start window, with the reason each one stopped.
  inputs: [{name: Run signal, unit: kW or rpm}]
  valid: Compression trains with a run signal.
  needs: A run signal over the window.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

protection:
  title: Machinery protection channels against their settings
  standard: "API 670"
  inputs: [{name: Shaft vibration, unit: µm}, {name: Axial position, unit: mm}, {name: Bearing temperature, unit: "°C"}]
  valid: Machines with protection channels and their alarm and trip settings on record, while running.
  needs: Protection channels on the machine and enough running time in the window.
  thresholds:
    trip_range: {value: 90, unit: "%", means: "The range given around the date a channel reaches its trip."}
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

seal_gas:
  title: Dry gas seal primary vent flow
  standard: "API 692"
  inputs: [{name: Primary vent flow, unit: Nm³/h}]
  valid: Compressors with dry gas seals and a vent flow point.
  needs: At least 14 running days of seal vent flow.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

lube_oil:
  title: Lube oil header pressure and supply temperature
  standard: "API 614"
  inputs: [{name: Header pressure, unit: barg}, {name: Supply temperature, unit: "°C"}]
  valid: Machines with a lube oil system and its alarm and trip settings on record.
  needs: A lube oil pressure or temperature point and enough running time.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

gas_performance:
  title: Compressor stage performance on real-gas properties
  standard: "ASME PTC 10 (Schultz polytropic analysis); ISO 5389"
  inputs: [{name: Suction and discharge pressure, unit: barg}, {name: Suction and discharge temperature, unit: "°C"}, {name: Gas analysis, unit: mol %}]
  valid: Centrifugal compressor stages with a gas analysis for the service.
  needs: A centrifugal stage and enough running time in the window.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

power_balance:
  title: Stage gas power against driver output
  standard: "ASME PTC 10"
  inputs: [{name: Stage gas power, unit: kW}, {name: Gas turbine output power, unit: kW}]
  valid: Gas turbine driven centrifugal trains with every stage measurable.
  needs: An output power point on the driver and every stage measurable in the window.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

exhaust_spread:
  title: Gas turbine exhaust temperature spread
  practice: Spread between exhaust thermocouples against its clean level, naming the thermocouple that wandered.
  inputs: [{name: Exhaust thermocouples, unit: "°C"}]
  valid: Gas turbines with three or more exhaust thermocouples, while running.
  needs: Three exhaust thermocouples and enough running time in the window.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

hot_section:
  title: Fired hours against the hot section inspection interval
  practice: Running hours since the last hot section inspection against the maintenance plan's interval.
  inputs: [{name: Run signal, unit: kW or rpm}, {name: Hot section inspection plan, unit: h}]
  valid: Gas turbines with a hot section inspection plan that has a last-done date and an interval.
  needs: A hot section inspection plan with a last-done date and an interval.
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

engine_cylinders:
  title: Gas engine cylinder exhaust temperatures
  practice: Each cylinder's exhaust temperature against the others; a cold one misfires, a hot one is overloaded or lean.
  inputs: [{name: Cylinder exhaust temperatures, unit: "°C"}]
  valid: Gas engine driven machines with a thermocouple per cylinder, while running.
  needs: Cylinder exhaust temperatures and running time in the last two days.
  vectors: [{worked: "tests/analysis/test_recip.py::test_the_gas_engine_driver_has_a_misfiring_cylinder"}]

remaining_life:
  title: Remaining life from the trend to its limit
  standard: "ISO 13381-1"
  inputs: [{name: A trended condition parameter, unit: various}, {name: Its alarm or trip limit, unit: various}]
  valid: Rotating machines with a trend heading for a limit. The date carries a 90 % range.
  needs: A trend on the machine that heads for a limit.
  vectors: [{worked: "tests/analysis/test_condition.py::test_the_screen_raises_the_new_findings_with_their_remaining_life"}]

test_check:
  title: Latest well test against inflow and the lift curve
  practice: The test's liquid rate against the well's own inflow per bar of drawdown and, on a lifted well, its lift curve.
  inputs: [{name: Well tests with water cut, unit: Sm³/d}, {name: Flowing and shut-in wellhead pressure, unit: barg}]
  valid: Oil wells with a shut-in wellhead pressure in the last two years.
  needs: At least four oil well tests with a water cut, and a shut-in wellhead pressure.
  thresholds:
    test_suspect: {value: 25, unit: "%", means: "The test departs this far from the well's own inflow and choke: don't use it.", code: "fuzer.analysis.surveillance:SUSPECT", scale: 100}
    off_lift_curve: {value: 25, unit: "%", means: "Oil this far below the lift curve at the test's lift gas.", code: "fuzer.analysis.surveillance:OFF_CURVE", scale: 100}
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

deferment_attribution:
  title: Shortfall against decline, by cause
  practice: Each well's latest test below its Arps decline, given one cause and summed by cause across the scope.
  inputs: [{name: Well tests (oil rate), unit: Sm³/d}, {name: Deferment records, unit: Sm³}]
  valid: A jacket, area or facility with oil wells that have enough tests for a decline fit.
  needs: At least one oil well in scope with enough tests for a decline fit.
  thresholds:
    unexplained_shortfall: {value: 30, unit: "%", means: "This share of the shortfall has no cause on record.", code: "fuzer.analysis.surveillance:UNEXPLAINED", scale: 100}
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

vessel_loading:
  title: Offered load against a rating
  practice: What the wells upstream offer at their tested rates against the item's standing rating, in the rating's own units.
  inputs: [{name: Well test rates of the wells upstream, unit: Sm³/d}, {name: Rating, unit: the rating's own}]
  valid: Separators, scrubbers and meters with a liquid, oil or gas rating and wells upstream on the flow network.
  needs: A rating on record and wells upstream of the item.
  thresholds:
    overloaded: {value: 100, unit: "%", means: "Loading at or over the standing rating.", code: "fuzer.analysis.facilities:OVERLOADED"}
    near_capacity: {value: 90, unit: "%", means: "Loading close to the standing rating.", code: "fuzer.analysis.facilities:NEAR"}
    compared_with: {value: 90, unit: "days", means: "How far back the loading is compared with.", code: "fuzer.analysis.facilities:BACK_DAYS"}
  vectors: [{worked: "tests/analysis/test_calcs.py::test_every_check_returns_evidence_and_names_its_users"}]

backlog_health:
  title: Open maintenance backlog by age, urgency and criticality
  practice: Backlog ageing as maintenance planners read it; the shares are this registry's own.
  tool: backlog_health
  inputs: [{name: Open work orders (created, priority, basic finish), unit: orders}]
  valid: Preventive and corrective orders in the work management system of record.
  needs: At least one open order.
  thresholds:
    ageing: {value: 25, unit: "%", means: "This share of open orders older than the ageing age: the backlog isn't being worked down.", code: "fuzer.analysis.backlog:AGEING_SHARE", scale: 100}
    ageing_age: {value: 90, unit: "days", means: "The age past which an open order counts as ageing.", code: "fuzer.analysis.backlog:AGEING_DAYS"}
  vectors: [{worked: "tests/analysis/test_backlog.py::test_backlog_health_flags_and_ranks"}]

voidage_replacement:
  title: Water injected against the reservoir volume produced
  practice: "Voidage replacement ratio as reservoir engineers screen waterfloods (Craig, The Reservoir Engineering Aspects of Waterflooding, SPE Monograph 3): injected water times its formation volume factor over produced oil, water and free gas at reservoir conditions. The formation volume factors and solution GOR are the field's own PVT."
  tool: voidage_replacement
  inputs: [{name: Allocated oil, unit: "Sm³"}, {name: Water injected, unit: "Sm³"}, {name: Well tests (oil rate, water cut, GOR), unit: "Sm³/d, %, Sm³/Sm³"}, {name: Formation volume factors and solution GOR, unit: "rm³/Sm³, Sm³/Sm³"}]
  valid: Fields with water injection and producing oil wells with tests. Free gas from the producing GOR above the solution GOR; gas injection and aquifer influx are not counted.
  needs: A daily report, injection records and the four PVT values; without PVT the ratio is unknown, and with no injection there is no ratio.
  thresholds:
    under: {value: 0.9, means: "The latest months' ratio below this: the field is under-replacing what it produces.", code: "fuzer.analysis.water_injection:VRR_LOW"}
    over: {value: 1.1, means: "Above this: injecting more than it produces.", code: "fuzer.analysis.water_injection:VRR_HIGH"}
    months: {value: 3, unit: "months", means: "The latest months with injection the verdict reads.", code: "fuzer.analysis.water_injection:VRR_MONTHS"}
  vectors: [{worked: "tests/analysis/test_water_injection.py::test_voidage_replacement_reads_injection_against_produced_reservoir_volume"}]

hall_plot:
  title: An injector's Hall plot slope against its own earlier slope
  practice: "Hall (1963), Analyze Injection Well Performance: cumulative pressure x time against cumulative injection is a straight line while the well takes water the same way; it bends up with plugging or skin and down with fracturing or channelling. Read here at the wellhead, so each injector against itself."
  tool: injector_hall
  inputs: [{name: Monthly water injected, unit: "Sm³"}, {name: Days on injection, unit: days}, {name: Average wellhead injection pressure, unit: barg}]
  valid: Water injectors with monthly injection records carrying a wellhead pressure.
  needs: Twice the comparison months of injection.
  thresholds:
    months: {value: 3, unit: "months", means: "The latest months whose slope is set against the first half of the injector's history.", code: "fuzer.analysis.water_injection:HALL_MONTHS"}
    rise: {value: 1.25, means: "Latest slope over the earlier one above this: harder to inject (plugging or skin).", code: "fuzer.analysis.water_injection:HALL_RISE"}
    fall: {value: 0.8, means: "Below this: easier to inject (a fracture opening or channelling).", code: "fuzer.analysis.water_injection:HALL_FALL"}
  vectors: [{worked: "tests/analysis/test_water_injection.py::test_the_plugging_injector_bends_its_hall_plot"}]

gas_balance:
  title: Daily gas balance and its closure gap
  practice: "A facility gas balance as production accounting reads it (API MPMS Chapter 20.1 allocation practice): gas handled against export, lift gas, flare, fuel and vent, the remainder being the closure gap. The open band is this registry's own."
  tool: gas_balance
  inputs: [{name: Gas handled, unit: "kSm³/d"}, {name: "Gas export, lift gas, flare, fuel gas and vent", unit: "kSm³/d"}]
  valid: Facilities whose daily report carries the gas handled and its outlets; a term the report doesn't carry stays in the gap and is named.
  needs: A daily report with the gas handled.
  thresholds:
    open: {value: 2, unit: "%", means: "A day whose gap is more than this share of the gas handled is open.", code: "fuzer.analysis.gas_balance:GAP_PCT"}
  vectors: [{worked: "tests/analysis/test_gas_balance.py::test_the_balance_closes_to_the_meters_except_while_the_fuel_meter_read_zero"}]

productivity_index:
  title: Productivity index from a flowing survey against the static pressure before it
  practice: "Straight-line inflow above the bubble point (Craft and Hawkins, Applied Petroleum Reservoir Engineering): oil rate over drawdown. A fall against the well's own first index is screened; the share is this registry's own."
  tool: productivity_index
  inputs: [{name: Static bottomhole pressure, unit: barg}, {name: Flowing bottomhole pressure, unit: barg}, {name: Oil rate at the flowing survey, unit: "Sm³/d"}]
  valid: Oil wells above the bubble point with static and flowing surveys at a common datum.
  needs: A flowing survey with a rate and a static survey on the same well shortly before it.
  thresholds:
    pair: {value: 60, unit: "days", means: "A flowing survey pairs with the static survey at most this long before it.", code: "fuzer.analysis.reservoir_pressure:PAIR_DAYS"}
    fallen: {value: 0.75, means: "Latest index under this share of the first: fallen.", code: "fuzer.analysis.reservoir_pressure:PI_DROP"}
  vectors: [{worked: "tests/analysis/test_reservoir_pressure.py::test_productivity_index_from_surveys_and_the_well_that_scaled_up"}]

material_balance:
  title: One-tank material balance from static pressures and net voidage
  practice: "Havlena and Odeh (1963) straight-line material balance, reduced to an undersaturated tank with no aquifer or gas cap: pressure falls in proportion to the reservoir volume withdrawn net of injection, the slope being the inverse of pore volume times total compressibility."
  tool: material_balance
  inputs: [{name: Static bottomhole pressures, unit: barg}, {name: Allocated oil, water and free gas at reservoir conditions, unit: "rm³"}, {name: Water injected, unit: "rm³"}]
  valid: An undersaturated reservoir read as one tank, with recorded PVT and static surveys on wells surveyed more than once.
  needs: The PVT voidage replacement needs, and static surveys on at least two dates.
  thresholds:
    surveys: {value: 3, means: "Static surveys the fit needs, on wells surveyed at least twice.", code: "fuzer.analysis.reservoir_pressure:MIN_SURVEYS"}
  vectors: [{worked: "tests/analysis/test_reservoir_pressure.py::test_material_balance_recovers_the_tank_and_states_its_assumptions"}]

ldar:
  title: LDAR survey leaks, repeat leakers and coverage
  standard: "US EPA Method 21 (determination of volatile organic compound leaks)"
  practice: "A screening reading at or above the leak definition is a leak (500 ppm as in 40 CFR 60 subpart OOOOa); a component found leaking again is a repeat leaker. The coverage window is this registry's own."
  tool: ldar_surveys
  inputs: [{name: Component screening readings by survey, unit: ppm}]
  valid: Fugitive emission components screened by a Method 21 analyser and recorded against their tag.
  needs: At least one survey; equipment of a surveyed class with no reading is reported unknown.
  thresholds:
    leak: {value: 500, unit: "ppm", means: "A screening reading at or above this is a leak.", code: "fuzer.analysis.ldar:LEAK_PPM"}
    repeat: {value: 2, means: "Surveys a component must leak in to be a repeat leaker.", code: "fuzer.analysis.ldar:REPEAT_SURVEYS"}
    coverage: {value: 365, unit: "days", means: "A tag screened within this long before the window's end is covered.", code: "fuzer.analysis.ldar:COVERAGE_DAYS"}
  vectors: [{worked: "tests/analysis/test_ldar.py::test_surveys_find_the_repeat_leaker_and_name_the_unsurveyed_as_unknown"}]

ili_strength:
  title: ILI anomaly growth between runs and remaining strength against MOP
  standard: "ASME B31G (modified, 0.85 dL); ASME B31.8 design factors"
  practice: "Metal loss anomalies are matched between in-line inspection runs by type and station; growth is the depth change over the years between runs, projected ahead at that rate. Failure pressure uses the flow stress SMYS + 69 MPa; the safe pressure is the failure pressure times the class location's design factor, and ERF is MOP over the safe pressure. The matching distance, horizon and depth limit are this registry's own screening choices."
  tool: ili_anomalies
  inputs: [{name: Anomaly depth, unit: "% of wall"}, {name: Anomaly length, unit: mm}, {name: Wall thickness, unit: mm}, {name: Outside diameter, unit: mm}, {name: SMYS of the API 5L grade, unit: MPa}, {name: Maximum operating pressure, unit: barg}]
  valid: External or internal metal loss on carbon steel line pipe sized by an in-line inspection tool, on a segment with a recorded grade, wall and class location.
  needs: ILI features on a line with PODS segments; two runs for growth. No strength without a recorded material grade.
  thresholds:
    match: {value: 1.5, means: "An anomaly of the same type within this many metres in the next run is the same anomaly.", code: "fuzer.analysis.ili:MATCH_M"}
    horizon: {value: 5, unit: "years", means: "Growth is projected this far ahead of the latest run.", code: "fuzer.analysis.ili:HORIZON_YEARS"}
    depth_limit: {value: 80, unit: "%", means: "An anomaly this deep (% of wall) crosses the screen whatever its pressure.", code: "fuzer.analysis.ili:DEPTH_LIMIT"}
    tool_tolerance: {value: 10, unit: "%", means: "Growth (% of wall) under this between two runs may be tool sizing, and is said so.", code: "fuzer.analysis.ili:TOLERANCE_PCT"}
  vectors:
    - kernel: fuzer.analysis.ili:failure_pressure
      args: [49, 131, 15.9, 610.0, 448]
      expect: 220.70015
      says: "49 % deep, 131 mm long on 610 x 15.9 mm API 5L X65: modified B31G at a 517 MPa flow stress fails at 220.7 bar."

lead_in:
  title: Process values in the hours before an event against the hours before that
  practice: A before and after comparison of each measurement's mean and extreme around the event.
  tool: process_values
  inputs: [{name: Historian readings on the asset's points, unit: each point's own}]
  valid: Any measured point with readings either side of the lead-in.
  needs: Readings both before and inside the lead-in.
  thresholds:
    lead_in: {value: 12, unit: "h", means: "The stretch before the event that is compared with what came before it.", code: "fuzer.sources.timeseries:LEAD_IN_HOURS"}
  vectors: [{worked: "tests/sources/test_historian.py::test_live_ingest_loads_pi_and_adx_and_values_come_from_them"}]

data_sufficiency:
  title: Whether a series is enough to quote a result from
  practice: One shared check (P4.6) on the readings behind a result, before any forecast or ranking is quoted; too few readings or too short a span is too little data, a long gap is quotable but thin.
  tool: every forecast (fuzer.analysis.forecast:sufficiency)
  inputs: [{name: Times of the readings, tests or days the result rests on, unit: dates}]
  valid: Any time series, record list or set of tests a method projects or ranks from.
  needs: The times of the readings; each caller sets its own minimum points, span and largest gap.
  thresholds:
    trend_min_days: {value: 7, unit: "days", means: "Daily values a condition trend needs before it projects a date to a limit.", code: "fuzer.analysis.condition:TREND_MIN_DAYS"}
    trend_max_gap: {value: 7, unit: "days", means: "A longer gap between a trend's daily values (a stop, an outage) makes it thin.", code: "fuzer.analysis.condition:TREND_MAX_GAP_DAYS"}
  vectors:
    - kernel: fuzer.analysis.forecast:sufficiency
      args: [["2026-01-01", "2026-01-02", "2026-01-03"], 7]
      expect: {verdict: too_little_data, quotable: false, points: 3, span_days: 2}
      says: Three readings where seven are needed is too little data, not a number.
    - kernel: fuzer.analysis.forecast:sufficiency
      args: [["2026-01-01", "2026-01-02", "2026-01-03", "2026-01-04", "2026-01-05", "2026-01-06", "2026-01-20"], 7, 0, 7]
      expect: {verdict: thin, quotable: true, points: 7, largest_gap_days: 14, window: ["2026-01-01", "2026-01-20"]}
      says: Seven readings with a 14 day hole are quotable, but thin, and say why.

forecast_range:
  title: A forecast with its prediction range
  practice: The 90 % prediction interval of a least squares fit (Student t on the residual scatter, widening away from the data); for an Arps decline, on log rate, where the fit is made. A forecast is an estimate, never a plan.
  tool: every forecast (fuzer.analysis.forecast:trend_interval, arps_interval)
  inputs: [{name: The series the fit was made on, unit: the series' own}, {name: Where to forecast, unit: the fit's time axis}]
  valid: A fit to three or more points; the range assumes the scatter about the fit stays as it was.
  needs: At least three points and a sufficiency verdict that is quotable.
  vectors:
    - kernel: fuzer.analysis.forecast:trend_interval
      args: [[0, 1, 2, 3, 4], [1.0, 3.0, 2.0, 5.0, 4.0], 6]
      expect: {value: 6.2, range: [1.886214, 10.513786], points: 5}
      says: The line 1.4 + 0.8x at x = 6 is 6.2, and a new point there falls in 1.89 to 10.51 nine times in ten (t 2.353, s 1.095).
    - kernel: fuzer.analysis.forecast:arps_interval
      args: [{model: exponential, qi: 100.0, D: 0.2, b: 0.0}, [0, 1, 2, 3, 4], [100.0, 80.0, 70.0, 54.0, 45.0], 5]
      expect: {value: 36.787944, range: [33.224857, 40.733142]}
      says: The same decline through scattered tests forecasts 36.79 at year 5 within 33.2 to 40.7.

period_comparison:
  title: Each measurement in two windows, before and after a change
  practice: Medians and the change, with Welch's t on the means and each window's sample cut to its effective size for autocorrelation (n (1 - r1) / (1 + r1)); each window through the shared sufficiency check first. A significant change after a fix does not prove the fix caused it.
  tool: compare_periods
  inputs: [{name: Historian readings on the point or the unit's points, unit: each point's own}]
  valid: Any measured point with readings in both windows; windows of similar operation compare best.
  needs: Enough readings in each window for the shared sufficiency check; a point without them is listed as not compared.
  thresholds:
    significant: {value: 0.05, means: "The p value under which a change is called significant.", code: "fuzer.analysis.cases:P_SIGNIFICANT"}
    min_readings: {value: 5, means: "Readings each window needs before a point is compared.", code: "fuzer.analysis.cases:PERIOD_MIN_POINTS"}
    window_gap: {value: 1, unit: "days", means: "A gap this long inside a window makes the comparison thin.", code: "fuzer.analysis.cases:PERIOD_MAX_GAP_DAYS"}
  vectors: [{worked: "tests/plots/test_views.py::test_compare_periods_and_similar_cases"}]

alarm_performance:
  title: Alarm system performance over a window
  standard: "ANSI/ISA-18.2 and EEMUA 191"
  tool: alarm_analysis
  inputs: [{name: Alarm limits on each point and the historian readings that cross them, unit: alarms}]
  valid: Points with an enabled DCS or AF alarm limit; the alarms are the DCS alarm and event journal's where one covers the window (#859), else each reading past a limit while the unit runs.
  needs: Enabled alarm limits and readings over the window.
  thresholds:
    target_per_hour: {value: 6, means: "Alarms per hour an operator can handle, about one every 10 minutes.", code: "fuzer.analysis.alarms:TARGET_PER_HOUR"}
    flood: {value: 10, means: "Alarms in 10 minutes past which it is a flood.", code: "fuzer.analysis.alarms:FLOOD"}
    standing: {value: 24, unit: "h", means: "An alarm on this long is standing.", code: "fuzer.analysis.alarms:STANDING_HOURS"}
    chattering: {value: 3, means: "Alarms on one point, each within a minute of the last clearing, that make it chattering.", code: "fuzer.analysis.alarms:CHATTER"}
  vectors: [{worked: "tests/analysis/test_alarms.py::test_alarm_analysis_reads_the_week"}]

instrument_health:
  title: Whether a transmitter's readings can be trusted
  practice: Frozen, stuck, noisy, out of range and redundant transmitters drifting apart, each against the point's own last week; the spans and ratios are this registry's own.
  tool: instrument_health
  inputs: [{name: Historian readings on the point or every point on the unit, unit: each point's own}]
  valid: Any measured point with a week of readings before the window.
  needs: A week of readings before the window and readings inside it.
  thresholds:
    frozen: {value: 2, unit: "h", means: "No change at all for this long: frozen (communications, a stale tag).", code: "fuzer.analysis.signals:FLAT_HOURS"}
    stuck: {value: 6, unit: "h", means: "High-frequency spread far under its usual for this long without being frozen: sticking.", code: "fuzer.analysis.signals:STUCK_HOURS"}
    stuck_ratio: {value: 0.1, means: "The share of its usual spread under which it counts as stuck.", code: "fuzer.analysis.signals:STUCK"}
    noisy: {value: 1, unit: "h", means: "Spread far over its usual for this long: hunting or a loose connection.", code: "fuzer.analysis.signals:NOISY_HOURS"}
    noisy_ratio: {value: 4, means: "Times its usual spread over which it counts as noisy.", code: "fuzer.analysis.signals:NOISY"}
    out_of_range: {value: 30, unit: "min", means: "At or past the end of its range for this long.", code: "fuzer.analysis.signals:RANGE_MINUTES"}
    drift: {value: 2, unit: "h", means: "Redundant transmitters apart for this long.", code: "fuzer.analysis.signals:DRIFT_HOURS"}
  vectors: [{worked: "tests/analysis/test_calcs.py::test_health_finds_the_hunting_level_transmitter"}]

loop_oscillation:
  title: Whether a control loop is cycling, with its period and amplitude
  practice: Regularity of the autocorrelation's zero crossings (Thornhill, Huang and Zhang, 2003), with a check that the autocorrelation comes back one period on; the minimum cycles and that check are this registry's own.
  inputs: [{name: Historian readings on the unit's points or one point, unit: each point's own}]
  valid: A measurement a controller holds near one level (a level, temperature, pressure or flow), over a window of several cycles.
  needs: A day or more of 5-minute readings, and at least four cycles in the window.
  thresholds:
    regular: {value: 1.0, means: "Regularity r over which the cycling is regular, not noise.", code: "fuzer.analysis.loops:REGULAR"}
    min_cycles: {value: 4, means: "Cycles the window must hold before regularity is judged.", code: "fuzer.analysis.loops:MIN_CYCLES"}
    acf_peak: {value: 0.4, means: "How high the autocorrelation must come back one period on.", code: "fuzer.analysis.loops:ACF_PEAK"}
  vectors:
    - {kernel: "fuzer.analysis.loops:regularity", args: [[10, 10, 10, 11, 9]], expect: 5.2705, says: "Half periods of 10, 10, 10, 11 and 9 samples: periods average 20 with a spread of 1.26, so r = 20 / 3.79 = 5.27, a regular cycle."}
    - {worked: "tests/analysis/test_loops.py::test_the_test_separator_level_cycles_while_its_valve_sticks"}

contactor_foaming:
  title: Contactor differential pressure against its clean level (foaming and fouling)
  practice: "GPSA Engineering Data Book (hydrocarbon treating and dehydration): foaming shows first as a sudden rise in column differential pressure, with carryover and off-spec gas; a slow climb is fouling or damaged packing."
  inputs: [{name: Contactor differential pressure, unit: bar}, {name: Treated gas analyser (optional), unit: "mol% or mg/Sm³"}]
  valid: Amine and glycol contactors with a differential pressure point, while gas flows through them.
  needs: A week of differential pressure history before the last two days.
  thresholds:
    foaming: {value: 150, unit: "%", means: "Peak differential pressure as a share of the clean level, reached within a day, that reads as foaming.", code: "fuzer.analysis.treating:FOAM_TIMES", scale: 100}
    fouling: {value: 125, unit: "%", means: "The last week's median as a share of the clean level that reads as fouling.", code: "fuzer.analysis.treating:FOUL_TIMES", scale: 100}
  vectors: [{worked: "tests/analysis/test_treating.py::test_the_amine_contactor_foamed_after_the_restart"}]

treated_gas:
  title: Treated gas analyser against its operating window
  practice: "GPSA Engineering Data Book; API 12GDU for glycol dehydration units. The limit is the site's recorded window (IOW, alarm settings or the learned range), not a number in the code."
  inputs: [{name: Treated gas analyser, unit: "mol% or mg/Sm³"}, {name: Operating window, unit: same}]
  valid: Contactors with a treated gas analyser (acid gas after an amine column, water after a glycol one).
  needs: Seven days of analyser readings and an operating window on the point.
  thresholds:
    approaching: {value: 30, unit: days, means: "On course for the limit within this many days.", code: "fuzer.analysis.treating:SOON_DAYS"}
  vectors: [{worked: "tests/analysis/test_treating.py::test_the_glycol_unit_lost_purity_as_its_reboiler_cooled"}]

regenerator:
  title: Reboiler temperature against its operating window
  practice: "GPSA Engineering Data Book; API 12GDU for glycol dehydration units: too cold leaves the solvent under-stripped, too hot degrades it. The window is the site's recorded one."
  inputs: [{name: Reboiler temperature, unit: "°C"}, {name: Operating window, unit: "°C"}]
  valid: Amine, glycol and stabilizer reboilers with a temperature point.
  needs: Seven days of temperature readings and an operating window on the point.
  thresholds:
    drifting: {value: 30, unit: days, means: "On course for a limit within this many days.", code: "fuzer.analysis.treating:SOON_DAYS"}
  vectors: [{worked: "tests/analysis/test_treating.py::test_the_glycol_unit_lost_purity_as_its_reboiler_cooled"}]

chiller:
  title: Low temperature separator temperature against its operating window
  practice: "GPSA Engineering Data Book (refrigeration, hydrocarbon dew point control): the separator temperature sets the dew point of the gas leaving it. The limit is the site's recorded window."
  inputs: [{name: Separator temperature, unit: "°C"}, {name: Operating window, unit: "°C"}]
  valid: Chilled (low temperature) separators of a dew point control unit with a temperature point.
  needs: Seven days of temperature readings and an operating window on the point.
  vectors: [{worked: "tests/analysis/test_treating.py::test_the_chiller_holds_the_dew_point"}]

inspection_plan:
  title: Condition inspection plan against the interval the wall loss supports
  standard: "API 510 / API 570"
  inputs: [{name: Inspection plan interval and dates, unit: days}, {name: Wall thickness readings per CML, unit: mm}, {name: Minimum required thickness, unit: mm}]
  valid: Pressure vessels, exchangers and piping with a condition inspection plan in the maintenance plans. The supported interval needs repeat thickness readings and a retirement thickness (recorded per CML, or the line's design).
  needs: A condition inspection plan concerning the item.
  thresholds:
    longest_interval: {value: 10, unit: "years", means: "The supported interval is half the remaining life, at most this long.", code: "fuzer.analysis.integrity:MAX_INTERVAL"}
  vectors: [{worked: "tests/analysis/test_static_equipment.py::test_the_amine_contactor_plan_outlasts_its_wall"}]

allocation_factor:
  title: Allocation factor of a meter against the well tests upstream of it
  practice: "API MPMS Chapter 20.1 (allocation measurement): the measured volume at a reference meter divided by the sum of the wells' theoretical volumes (their latest tests, while flowing). Off one, the tests are stale or the meter reads wrong, and every well's allocated volume carries the error."
  inputs: [{name: Meter flow, unit: "Sm³/d or kSm³/d"}, {name: Well tests upstream (oil rate, GOR or gas rate), unit: "Sm³/d or kSm³/d"}]
  valid: Meters on the allocation network with wells upstream and a flow point; oil for a liquid meter, formation gas (lift gas left out) for a gas meter. A meter downstream of processing carries shrinkage and fuel, so read it against its own previous factor.
  needs: A well test within the test age for the wells upstream, and days with the meter flowing.
  thresholds:
    band_low: {value: 90, unit: "%", means: "Below this the meter reads low or the tests overstate the wells.", code: "fuzer.analysis.metering:AF_LOW", scale: 100}
    band_high: {value: 110, unit: "%", means: "Above this the meter reads high or the tests understate the wells.", code: "fuzer.analysis.metering:AF_HIGH", scale: 100}
    shift: {value: 5, unit: "%", means: "Change in the factor since the window before (in points) that is flagged inside the band.", code: "fuzer.analysis.metering:AF_SHIFT", scale: 100}
    test_age: {value: 120, unit: days, means: "A well test older than this doesn't count towards a day's offer.", code: "fuzer.analysis.metering:TEST_DAYS"}
  vectors: [{worked: "tests/analysis/test_metering.py::test_the_sales_meter_allocates_low_once_it_drifts"}]

meter_agreement:
  title: A meter against the nearest other meter on the same stream
  practice: "API MPMS Chapter 21.1 and 5 (flow measurement, meter proving and check metering): a custody meter is checked against a check meter on the same stream; the ratio of the two holds while both read true, and a step in it is one of them drifting."
  inputs: [{name: Meter flow, unit: "Sm³/d or kSm³/d"}, {name: Other meter's flow on the same stream, unit: same}]
  valid: Meters with another meter of the same phase within four steps up or down the allocation network.
  needs: Three days with both flowing in the window and seven in the month before it.
  thresholds:
    drift: {value: 2, unit: "%", means: "Change in the two meters' daily ratio against its level over the month before that reads as one of them drifting.", code: "fuzer.analysis.metering:DRIFT_PCT"}
    baseline: {value: 30, unit: days, means: "The days before the window the ratio's level is taken over.", code: "fuzer.analysis.metering:BASELINE_DAYS"}
  vectors: [{worked: "tests/analysis/test_metering.py::test_the_check_meter_sees_the_sales_meter_step"}]

proof_test:
  title: A safeguard's last proof test against its proof test interval
  standard: IEC 61511-1
  clause: "16.3"
  tool: safeguard_status
  inputs: [{name: Proof test interval on the safeguard register, unit: months}, {name: Last proof test, unit: date}]
  valid: Any trip, interlock or shutdown on the safeguard register with a proof test interval.
  needs: A proof test interval on the register; a safeguard with one and no test on file is overdue.
  vectors: [{worked: "tests/evals/test_safeguards_kestrel.py::test_a_safeguard_past_its_proof_test_interval_is_work_until_it_is_tested"}]

demand_rate:
  title: A safeguard's demands over the last year against the demand rate it was designed for
  standard: IEC 61511-1
  clause: "16.2.9"
  tool: safeguard_status
  inputs: [{name: The site's demand log (when, worked, failed or spurious), unit: demands}, {name: Designed demand rate on the safeguard register, unit: per year}]
  valid: Safeguards in low demand mode with a demand log; a spurious trip is listed but is not a demand.
  needs: At least one demand in the window; with no designed rate on the register, the IEC 61508 low demand boundary.
  thresholds:
    window: {value: 365, unit: days, means: "The demands read against the designed rate.", code: "fuzer.ops.safeguards:DEMAND_DAYS"}
    low_demand: {value: 1, means: "The demands a year a safeguard is taken to be designed for when the register gives none (the low demand boundary).", code: "fuzer.ops.safeguards:LOW_DEMAND"}
