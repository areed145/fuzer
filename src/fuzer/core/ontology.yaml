# The data model Fuzer ships (#241): every entity kind and link type the built-in mappings, rebuild and
# Claude's reading produce. Seeded into ontology_kind / ontology_relation; a person's edit in the UI is
# kept over a later change here. Kinds and link types a project adds live only in the database.
#
# kind:     label, group (how the Ontology page groups kinds), colour (mid-tone, reads on light and dark),
#           label_field (the golden field shown as its name, when it isn't the key), description.
# relation: label, view (the Ontology page's link views), dated (has from/to dates), from / to (the kinds
#           allowed at each end; empty means any), description.

groups: [Physical, Equipment, Production, Data, Maintenance, Events, Documents, Planning]

views:
  physical: Physical
  classes: Classes & models
  flow: Flow / allocation
  data: Data
  documents: Documents & logs
  events: Events
  maintenance: Maintenance
  production: Downtime & reports
  incidents: Incidents
  knowledge: Documents
  planning: Planning

kinds:
  facility:
    label: Facility
    group: Physical
    colour: "#5f6b7a"
    description: A production facility or installation; the top of the physical hierarchy.
  area:
    label: Area
    group: Physical
    colour: "#1f9e9e"
    description: A part of a facility (a module, train, jacket or platform).
  tag:
    label: Tag
    group: Physical
    colour: "#2f7bd8"
    description: A functional position such as 20-P-1001B. The tag stays when the equipment at it is swapped.
  pipeline:
    label: Pipeline
    group: Physical
    colour: "#4f8a8b"
    description: A pipeline or flowline between areas or facilities.
  pipeline_segment:
    label: Pipeline segment
    group: Physical
    colour: "#3f7374"
    description: >-
      A stretch of a pipeline between two stations (a PODS route segment, typically block valve to block valve),
      with its own wall thickness, grade and class location.
  pipeline_feature:
    label: Pipeline feature
    group: Events
    colour: "#6aa3a4"
    description: >-
      Something an in-line inspection run found at a station along a line: metal loss, a dent, a weld anomaly,
      or a fitting it used as a reference.
  completion_component:
    label: Completion component
    group: Physical
    colour: "#7a52b8"
    description: >-
      A piece of a well's completion (casing, liner, tubing, a packer, a nipple, a frac stage) between a top and a
      base measured depth.
  well:
    label: Well
    group: Physical
    colour: "#8a5cd6"
    description: A well (A-07); sidetracks are their own wells ("A-07 ST1").
  equipment:
    label: Equipment
    group: Equipment
    colour: "#d9822b"
    description: The physical item installed at a tag, identified by serial number.
  equipment_model:
    label: Equipment model
    group: Equipment
    colour: "#b5651d"
    description: A manufacturer and model.
  equipment_class:
    label: Equipment class
    group: Equipment
    colour: "#3f6e8c"
    description: An ISO 14224 category, class or type (ISO14224:PU.CE is centrifugal pumps).
  material:
    label: Material
    group: Equipment
    colour: "#9c7a54"
    description: A spare part or material master record.
  purchase_order:
    label: Purchase order
    group: Equipment
    colour: "#b08d62"
    description: A purchase order line for a material, with its quantity and delivery date.
  work_center:
    label: Work center
    group: Maintenance
    colour: "#7d8f69"
    description: A maintenance crew that work is planned against, with its crew size.
  permit:
    label: Permit to work
    group: Maintenance
    colour: "#c0634a"
    description: A permit to work on a location, with its type, state and validity.
  isolation:
    label: Isolation
    group: Maintenance
    colour: "#a8553f"
    description: A point a permit needs isolated, how, and whether it is in place.
  safeguard:
    label: Safeguard
    group: Maintenance
    colour: "#b5463a"
    description: A trip, interlock or shutdown, the instrument it acts on and the equipment it protects.
  bypass:
    label: Bypass
    group: Maintenance
    colour: "#d08a3c"
    description: A safeguard taken out of service, with its state, when it went in, its expiry and change record.
  demand:
    label: Safeguard demand
    group: Maintenance
    colour: "#c0603f"
    description: A time a safeguard was called on to act, whether it worked, failed or acted spuriously, and why.
  change:
    label: Change record
    group: Maintenance
    colour: "#9a6fb0"
    description: A management of change record, with its type, state, and when it opened and must close.
  round_point:
    label: Round point
    group: Maintenance
    colour: "#6b8fa3"
    description: A point an operator reads or checks on a round, with its limits.
  control_loop:
    label: Control loop
    group: Data
    colour: "#5f9ea0"
    description: >-
      A control loop from the DCS loop list: its controller tag, the item it holds, its final element, and the PI
      points of its process value, setpoint, controller output and mode, which resolve together through it.
  step_test:
    label: Step test
    group: Data
    colour: "#7fb3b5"
    description: >-
      An open-loop step test on a control loop: the controller in manual, its output stepped by hand, and the value
      recorded at a high rate, with when it ran and the size of the step.
  vibration_spectrum:
    label: Vibration spectrum
    group: Maintenance
    colour: "#7d8fb3"
    description: >-
      A condition-monitoring spectrum taken at a measurement point on a machine (a bearing, in a direction), with the
      running speed, the bearing's geometry from the point's setup, and the spectrum's peaks.
  allocation_node:
    label: Allocation node
    group: Production
    colour: "#c4a000"
    description: A node in the Energy Components allocation network.
  production_day:
    label: Production day
    group: Production
    colour: "#95a5a6"
    description: The Energy Components DAY001 record of a day's allocated production.
  accounting_volume:
    label: Accounted volume
    group: Production
    colour: "#7f8c8d"
    description: A month's oil or gas as production accounting closed it on the custody meters.
  ledger_entry:
    label: Ledger entry
    group: Production
    colour: "#8e7f6a"
    description: Operating cost booked in the ledger for a month and cost element, in its own currency.
  downtime:
    label: Downtime
    group: Production
    colour: "#e67e22"
    description: An Energy Components deferment record; affects a well or the facility, caused by tags, with lost oil.
  well_test:
    label: Well test
    group: Production
    colour: "#6c5ce7"
    description: A well test result.
  timeseries:
    label: Time series
    group: Data
    colour: "#2a9d5c"
    description: A PI point.
  notification:
    label: Notification
    group: Maintenance
    colour: "#c0392b"
    description: An SAP PM notification, with its ISO 14224 failure mode and mechanism.
  work_order:
    label: Work order
    group: Maintenance
    colour: "#7f8c3d"
    description: An SAP PM work order, with its maintenance activity.
  maintenance_plan:
    label: Maintenance plan
    group: Maintenance
    colour: "#6b8e23"
    description: A preventive maintenance or inspection plan.
  log_entry:
    label: Log entry
    group: Events
    colour: "#a0679b"
    description: An operator log entry.
  conversation:
    label: Conversation
    group: Events
    colour: "#7a6fb0"
    description: A troubleshooting thread from a chat channel, kept as a summary and a link back to it.
  event:
    label: Event
    group: Events
    colour: "#d6455d"
    description: A trip, start, changeover, shut-in, choke change, alarm, leak or instrument fault, read from operator logs by Claude.
  incident:
    label: Incident
    group: Events
    colour: "#8e44ad"
    description: An upset on one unit, grouping its events, downtime and notifications.
  document:
    label: Document
    group: Documents
    colour: "#7b8794"
    description: A P&ID sheet, OEM manual, troubleshooting guide or procedure revision.
  document_section:
    label: Document section
    group: Documents
    colour: "#a5b1c2"
    description: A section of a document, with its heading, page and text.
  activity:
    label: Activity
    group: Planning
    colour: "#16a085"
    description: >-
      A project, WBS element or activity in a schedule (Primavera P6, MS Project), with planned, baseline and
      actual dates and percent complete. A project is a top-level activity; the rest are part of their parent.

relations:
  part_of:
    label: part of
    view: physical
    description: Containment in the physical, document or schedule hierarchy.
    from: [area, tag, well, document_section, activity, pipeline_segment, completion_component]
    to: [facility, area, tag, well, document, activity, pipeline]
  installed_at:
    label: installed at
    view: physical
    dated: true
    description: Equipment installed at a tag, for a period.
    from: [equipment]
    to: [tag]
  sidetrack_of:
    label: sidetrack of
    view: physical
    description: A sidetrack and the well it was drilled from.
    from: [well]
    to: [well]
  located_at:
    label: located at
    view: physical
    description: >-
      Manifolds and wells on the jacket or platform they are on; a scheduled activity and the plant it is planned on;
      a control loop and the item it holds.
    from: [allocation_node, well, activity, control_loop]
    to: [area, facility, tag, well]
  found_on:
    label: found on
    view: physical
    description: >-
      A pipeline feature and the line it was found on, then the segment whose station range holds it (its station
      in the link's props).
    from: [pipeline_feature]
    to: [pipeline, pipeline_segment]
  starts_at:
    label: starts at
    view: physical
    description: Where a pipeline starts.
    from: [pipeline]
    to: [area, facility, tag]
  ends_at:
    label: ends at
    view: physical
    description: Where a pipeline ends.
    from: [pipeline]
    to: [area, facility, tag]
  classified_as:
    label: classified as
    view: classes
    description: A tag or equipment and its ISO 14224 class.
    from: [tag, equipment]
    to: [equipment_class]
  instance_of:
    label: instance of
    view: classes
    description: Equipment and its manufacturer model.
    from: [equipment]
    to: [equipment_model]
  is_a:
    label: is a
    view: classes
    description: A model's class, or a class's parent class.
    from: [equipment_model, equipment_class]
    to: [equipment_class]
  uses_part:
    label: uses part
    view: classes
    description: Equipment and the spare parts it takes.
    from: [equipment]
    to: [material]
  orders:
    label: orders
    view: classes
    description: A purchase order and the material it is for.
    from: [purchase_order]
    to: [material]
  done_by:
    label: done by
    view: maintenance
    description: A work order and the work center (crew) that does it.
    from: [work_order]
    to: [work_center]
  covers:
    label: covers
    view: maintenance
    description: A permit to work and the location it permits work on.
    from: [permit]
    to: [tag, equipment, area, facility]
  isolation_for:
    label: isolation for
    view: maintenance
    description: An isolation and the permit that needs it.
    from: [isolation]
    to: [permit]
  acts_on:
    label: acts on
    view: maintenance
    description: A safeguard and the instrument it acts on.
    from: [safeguard]
    to: [tag, equipment]
  protects:
    label: protects
    view: maintenance
    description: A safeguard and the equipment it protects.
    from: [safeguard]
    to: [tag, equipment, area]
  bypasses:
    label: bypasses
    view: maintenance
    description: A bypass and the safeguard it takes out of service.
    from: [bypass]
    to: [safeguard]
  demands:
    label: demands
    view: maintenance
    description: A demand and the safeguard it called on.
    from: [demand]
    to: [safeguard]
  checks:
    label: checks
    view: maintenance
    description: A round point, or a condition-monitoring spectrum, and the equipment it reads or checks.
    from: [round_point, vibration_spectrum]
    to: [tag, equipment, area, facility]
  flows_to:
    label: flows to
    view: flow
    dated: true
    description: Production and allocation flow.
    from: [well, tag, allocation_node]
    to: [tag, allocation_node]
  lift_gas_to:
    label: lift gas to
    view: flow
    dated: true
    description: The gas lift network, from compression through lift gas headers and manifolds to gas lifted wells.
    from: [tag, allocation_node]
    to: [tag, allocation_node, well]
  pipes_to:
    label: pipes to
    view: flow
    description: Piping between tags, read from P&IDs.
    from: [tag]
    to: [tag]
  drives:
    label: drives
    view: flow
    description: A driver (gas turbine, engine or motor) and the machine it turns, by shaft.
    from: [tag]
    to: [tag]
  controls:
    label: controls
    view: flow
    description: An instrument loop on a P&ID, from the transmitter to the final element its controller drives.
    from: [tag]
    to: [tag]
  has_timeseries:
    label: has time series
    view: data
    description: A tag, well or control loop and its PI points.
    from: [tag, well, control_loop]
    to: [timeseries]
  tests:
    label: tests
    view: data
    description: A well test and the well it tested, or a step test and the control loop it tested.
    from: [well_test, step_test]
    to: [well, control_loop]
  mentions:
    label: mentions
    view: documents
    description: A document, log or record whose text names an entity.
    from: []
    to: []
  reports:
    label: reports
    view: events
    description: A log entry or record and the event it reports.
    from: [log_entry, downtime, production_day]
    to: [event]
  involves:
    label: involves
    view: events
    description: An event and the tags, wells or areas it involves, with a role.
    from: [event]
    to: [tag, well, area]
  related_to:
    label: related to
    view: events
    description: A notification and the event it relates to.
    from: [notification]
    to: [event]
  concerns:
    label: concerns
    view: maintenance
    description: A notification, work order, plan or change record and the tag, equipment, area or facility it is for.
    from: [notification, work_order, maintenance_plan, change]
    to: [tag, equipment, area, facility]
  for_notification:
    label: for notification
    view: maintenance
    description: A work order and the notification it was raised for.
    from: [work_order]
    to: [notification]
  affects:
    label: affects
    view: production
    description: Downtime and the well or facility it deferred.
    from: [downtime]
    to: [well, facility]
  caused_by:
    label: caused by
    view: production
    description: Downtime and the tags that caused it.
    from: [downtime]
    to: [tag]
  reports_on:
    label: reports on
    view: production
    description: A production day, accounted volume or ledger entry and the facility it is for.
    from: [production_day, accounting_volume, ledger_entry]
    to: [facility]
  about:
    label: about
    view: incidents
    description: An incident and the unit it happened on.
    from: [incident]
    to: [tag, well]
  includes:
    label: includes
    view: incidents
    description: An incident and the events, downtime and notifications grouped into it.
    from: [incident]
    to: [event, downtime, notification]
  applies_to:
    label: applies to
    view: knowledge
    description: A document or section and the models, classes, tags or wells it applies to.
    from: [document, document_section]
    to: []
  supersedes:
    label: supersedes
    view: knowledge
    description: A document revision and the one it replaces.
    from: [document]
    to: [document]
  executes:
    label: executes
    view: planning
    description: A scheduled activity and the work order that carries it out.
    from: [activity]
    to: [work_order]
  refers_to:
    label: refers to
    view: documents
    description: A generic reference from a record to an entity, made by a suggested mapping. Replace it with a specific link type when one fits.
    from: []
    to: []
