# Trend templates (P5.12): what to look at together on equipment of a class, so a compressor opens on its pressures,
# temperatures, driver and vibration instead of one chart per tag.
#
# Templates are keyed by ISO 14224 class code (and WELL for a well). Each group is one panel of the trend. A trace is a
# measurement role (core/roles.py) on the unit itself, or `<relation>.<role>` on a neighbour:
#   driver      what drives the unit (its gas turbine or motor)
#   driven      what the unit drives
#   upstream    what pipes or flows to it (a compressor's suction scrubber)
#   downstream  what it pipes or flows to (its aftercooler)
# `show: false` groups start switched off. `expect` lists what an engineer would look for first: each entry is one or
# more traces, any of which will do; when none is found the view says so, instead of leaving it out silently.
# Nothing here names a facility or a tag: classes are ISO 14224's and roles are the platform's.
# A bundle adds or replaces a class's template under `trend_templates: {classes: {CODE: ...}}` in its pack.yaml, in
# this same shape; a class it names replaces the platform's whole template for that class.

generic:
  title: Process values
  # Any class without its own template: grouped by what each point measures, in this order, the first three shown.
  quantities: [pressure, temperature, flow, level, speed, power, vibration, displacement, position, composition, state]
  shown: 3

classes:
  CO:
    title: Compressor
    groups:
      - key: pressures
        label: Pressures
        traces: [upstream.pressure, suction_pressure, interstage_pressure, discharge_pressure, differential_pressure]
      - key: temperatures
        label: Temperatures
        traces: [suction_temperature, discharge_temperature, cylinder_discharge_temperature, downstream.outlet_temperature]
      - key: flow
        label: Flow and surge control
        traces: [suction_flow, anti_surge_valve_position]
      - key: driver
        label: Driver
        traces: [speed, power, running_status, driver.speed, driver.power, driver.running_status]
      - key: vibration
        label: Vibration and bearings
        traces: [vibration, shaft_vibration, bearing_temperature]
      - key: lube_seals
        label: Lube oil, seals and thrust
        show: false
        traces: [axial_position, lube_oil_pressure, lube_oil_temperature, seal_vent_flow, driver.lube_oil_pressure,
                 driver.lube_oil_temperature]
      - key: driver_fuel
        label: Driver exhaust and fuel
        show: false
        traces: [exhaust_temperature, fuel_flow, driver.exhaust_temperature, driver.fuel_flow]
    expect:
      - [suction_pressure, upstream.pressure]
      - [discharge_pressure]
      - [discharge_temperature, cylinder_discharge_temperature]
      - [speed, driver.speed, power, driver.power, running_status, driver.running_status]
      - [vibration, shaft_vibration]

  GT:
    title: Gas turbine
    groups:
      - key: load
        label: Speed and load
        traces: [speed, power, running_status, driven.suction_flow]
      - key: exhaust_fuel
        label: Exhaust and fuel
        traces: [exhaust_temperature, fuel_flow]
      - key: vibration
        label: Vibration and bearings
        traces: [vibration, shaft_vibration, bearing_temperature]
      - key: lube
        label: Lube oil
        show: false
        traces: [lube_oil_pressure, lube_oil_temperature]
    expect:
      - [speed, power]
      - [exhaust_temperature]

  PU:
    title: Pump
    groups:
      - key: pressures
        label: Pressures
        traces: [suction_pressure, upstream.pressure, discharge_pressure, differential_pressure]
      - key: flow
        label: Flow
        traces: [flow, suction_flow]
      - key: driver
        label: Motor
        traces: [power, speed, running_status, driver.power, driver.speed]
      - key: vibration
        label: Vibration and bearings
        traces: [vibration, bearing_temperature]
    expect:
      - [discharge_pressure]
      - [flow, power, driver.power]

  VE:
    title: Vessel
    groups:
      - key: pressure
        label: Pressure
        traces: [pressure, differential_pressure]
      - key: level
        label: Level
        traces: [level]
      - key: temperature
        label: Temperature
        traces: [temperature, outlet_temperature]
      - key: flows
        label: Flows in and out
        traces: [flow, upstream.flow, downstream.flow, downstream.suction_flow]
      - key: quality
        label: Quality
        show: false
        traces: [composition]
    expect:
      - [pressure]
      - [level]

  HE:
    title: Heat exchanger
    groups:
      - key: temperatures
        label: Temperatures
        traces: [upstream.discharge_temperature, outlet_temperature, temperature]
      - key: pressures
        label: Pressures
        traces: [pressure, differential_pressure]
      - key: flow
        label: Flow
        traces: [flow]
    expect:
      - [outlet_temperature, temperature]

  WELL:
    title: Well
    groups:
      - key: pressures
        label: Pressures
        traces: [wellhead_pressure, casing_pressure, pressure]
      - key: temperature
        label: Temperature
        traces: [wellhead_temperature, temperature]
      - key: lift_choke
        label: Choke and gas lift
        traces: [choke_position, gas_lift_rate]
      - key: flow
        label: Flow
        traces: [flow]
    expect:
      - [wellhead_pressure]
