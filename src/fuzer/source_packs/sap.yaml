# SAP PM: functional locations, equipment, BOMs, materials, maintenance plans, notifications and work orders.
# A built-in source pack (P1.5): the datasets name built-in mapping files and readers, assembled by
# fuzer.sources.packs.builtin. Optional datasets are ones not every site exports.
fuzer_source_pack: 1
system: {name: sap}
datasets: [sap_floc, sap_equipment, sap_bom, sap_materials, sap_purchase_orders, sap_reservations, sap_work_centers, sap_maintenance_plans, sap_notifications, sap_work_orders, sap_maintenance_codes]
optional: [sap_maintenance_codes, sap_purchase_orders, sap_reservations, sap_work_centers]
detectors: [records_gaps]
