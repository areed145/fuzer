# Leak detection and repair (LDAR) and emissions survey exports: component screening readings by survey.
# A built-in source pack (P1.5): the datasets name built-in mapping files and readers, assembled by
# fuzer.sources.packs.builtin. Optional datasets are ones not every site exports.
fuzer_source_pack: 1
system: {name: ldar}
datasets: [ldar_surveys]
optional: [ldar_surveys]
detectors: [repeat_leaks]
