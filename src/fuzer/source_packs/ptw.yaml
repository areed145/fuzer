# Permit to work: permits per functional location (type, state, valid from and to) and the isolations each needs.
# A built-in source pack (P1.5, P5.5c): the datasets name built-in mapping files and readers, assembled by
# fuzer.sources.packs.builtin. Optional datasets are ones not every site exports.
fuzer_source_pack: 1
system: {name: ptw}
datasets: [ptw_permits, ptw_isolations]
optional: [ptw_permits, ptw_isolations]
