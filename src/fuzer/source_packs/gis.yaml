# GIS: facilities, pipelines and wells on the map.
# A built-in source pack (P1.5): the datasets name built-in mapping files and readers, assembled by
# fuzer.sources.packs.builtin. Optional datasets are ones not every site exports.
fuzer_source_pack: 1
system: {name: gis}
datasets: [gis_facilities, gis_pipelines, gis_wells]
