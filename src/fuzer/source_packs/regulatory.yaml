# Regulatory permits (#370): the permit and obligation register, each condition with its owner, due dates and the limit
# as written. A built-in source pack (P1.5): the datasets name built-in mapping files, assembled by
# fuzer.sources.packs.builtin. Optional datasets are ones not every site exports.
fuzer_source_pack: 1
system: {name: regulatory}
datasets: [regulatory_conditions]
optional: [regulatory_conditions]
