# Management of change: the register of re-rates and derates, and the change records themselves (P3.9b).
# A built-in source pack (P1.5): the datasets name built-in mapping files and readers, assembled by
# fuzer.sources.packs.builtin. Optional datasets are ones not every site exports.
fuzer_source_pack: 1
system: {name: moc}
datasets: [moc_register, moc_changes]
optional: [moc_register, moc_changes]
