# Asset pack for the Okan field demo (NMA business unit, South Offshore area). Fake data made by
# `fakeplant generate --asset okan`. Installations are two-digit areas of the field "OKAN":
#   10 OKA_PP (production platform)    20 OK_GGCP (gas gathering and compression, trains A/B/C)
#   30 OKA_ST1, 40 OKA_ST2 (satellites) 50 OKA_NWP (new wells platform)   61-84 jackets OKJ-01..24
name: okan
facility: OKAN

tag_grammar:
  area_digits: 2
  loop_digits: [3, 5]
  function_codes: [P, V, K, E, GT, PT, TT, LT, FT, VT, ST, PDT, JT, HCV, FIC, LIC, PIC, TIC, XV, PSV, ZSC]

# Wells by site and slot: OK-J07-03 (jacket 07, slot 03), OK-NWP-05, gas producer OK-NWP-G2.
# Sources write them OKAN_J07_03 (EC), OK_J07_03.WHP (PI), OKAN-WELL-OKJ07-03 (SAP).
well_grammar:
  pattern: 'OK(?:AN)?[-_\s]?(?P<site>J\d{2}|NWP)[-_\s]?(?P<num>G\d|\d{2})'
  key: 'OK-{site}-{num}'

# Names people use instead of codes.
aliases:
  okan production platform: [area, OKAN-10]
  oka_pp: [area, OKAN-10]
  ok_ggcp: [area, OKAN-20]
  ggcp: [area, OKAN-20]
  oka_st1: [area, OKAN-30]
  oka_st2: [area, OKAN-40]
  oka_nwp: [area, OKAN-50]
  new wells platform: [area, OKAN-50]
  inlet separator: [tag, 20-V-2001]
  lift gas header: [tag, 20-PT-3003]
  compression bypass: [tag, 20-XV-3100]
  escravos gas plant: [facility, EGP]
  egp: [facility, EGP]

matching:
  equipment:
    auto_accept: 0.90
    review_min: 0.60

survivorship:
  default:
    priority: [review, sap, pi_af, pi, ec, gis, pid, oplog]
    review_on_conflict: false
  fields:
    manufacturer: {priority: [review, sap], review_on_conflict: true}
    model: {priority: [review, sap], review_on_conflict: true}
    description: {priority: [review, sap, pi_af, pi, ec, gis]}
    uom: {priority: [review, pi, pi_af]}

classification:
  taxonomy: iso14224
  tag_functions:
    P: PU
    K: CO
    E: HE
    V: VE
    GT: GT
    PT: IP.PR
    TT: IP.TE
    LT: IP.LE
    FT: IP.FL
    PDT: IP.DP
    ST: IP.SP
    VT: IP.VI
    FIC: CL
    LIC: CL
    PIC: CL
    TIC: CL
    XV: VA.ES
    HCV: VA.CH
    JT: IP
    PSV: VA.PS
    ZSC: IP
  templates:
    Centrifugal Pump: PU.CE
    Compressor: CO.CE
    Heat Exchanger: HE.ST
    Pressure Vessel: VE
    Gas Turbine: GT
  description_types:
    separator: SE
    scrubber: SC
    drum: DR
    cooler: ST
  manufacturer_aliases:
    solar: Solar Turbines
    bhge: Baker Hughes
    siemens: Siemens Energy
    alfa-laval: Alfa Laval
  extra_classes: {}

maintenance_codes:
  damage: {D01: VIB, D02: ELP, D03: FTS, D04: OHE, D05: LOO, D06: NOI, D07: AIR, D08: INL, D09: UST, D10: BRD}
  cause: {C01: "2.4", C02: "1.2", C03: "2.2", C04: "3.3", C05: "5.2", C06: "1.3"}
  activity: {A01: "1", A02: "2", A03: "4", A04: "6", A05: "10", A06: "9"}

# Links GIS didn't carry as IDs, found by distance: wells to the jacket or platform they stand on,
# and the ends of pipelines digitised without asset IDs to the facility they reach.
spatial_links:
  - {kind: well, to: [area], rel: located_at, max_m: 100}
  - {kind: pipeline, to: [area, facility], ends: [starts_at, ends_at], max_m: 300, only_missing: true}

# EC downtime reasons. "equipment" reasons are expected to name the equipment in the comment.
downtime_reasons:
  EQ-FAIL: {name: Equipment failure, category: equipment}
  PROC-TRIP: {name: Process trip, category: equipment}
  LIFT-GAS: {name: Lift gas shortfall, category: equipment}
  PLAN-MAINT: {name: Planned maintenance, category: planned}
  EXT-EGP: {name: EGP export curtailment, category: external}
  HYDRATE: {name: Hydrates, category: process}
  GL-VALVE: {name: Gas lift valve failure, category: well}
  WELL-INT: {name: Well intervention, category: well}
  WEATHER: {name: Weather, category: external}

# Value and risk score (#100): one explainable number in USD so an upset, a late PM and a gas lift move
# rank on one board. Change a price or the matrix here and everything re-ranks; no code changes.
value:
  currency: USD
  prices: {oil_sm3: 470, gas_ksm3: 150}       # ~75 $/bbl Brent; EGP gas contract
  horizon_days: 90                            # how long a risk or a gain counts if nothing is done
  incident_lookback_days: 365                 # upsets this recent are scored (as the cost of a repeat)
  risk_matrix:
    # Consequence levels 1-5 (people, environment, asset, reputation share one money scale).
    consequence_usd: [10000, 100000, 1000000, 10000000, 100000000]
    # Likelihood levels 1-5 from failures per year: upper bounds of levels 1-4, above is level 5.
    likelihood_per_year: [0.1, 0.3, 1, 3]
    # Bands by consequence x likelihood (highest score in each band).
    bands: {low: 4, medium: 9, high: 15, extreme: 25}
    # Share of failures that reach the worst credible consequence; most failures are a trip, not a fire.
    worst_case_share: 0.01
  # SAP ABC indicator -> worst credible consequence level per category.
  criticality:
    A: {people: 4, environment: 3, asset: 4, reputation: 3}
    B: {people: 2, environment: 2, asset: 3, reputation: 2}
    C: {people: 1, environment: 1, asset: 2, reputation: 1}
  compliance:
    usd_per_day_overdue: {PM: 100, INSP: 400, IOW: 2000}
    max_days: 365                             # overdue days count up to this
    criticality_factor: {A: 3, B: 2, C: 1}
  urgency:
    days: 30                                  # value halves when the consequence is this far away
    priority_days: {"1": 0, "2": 7, "3": 30, "4": 90}   # SAP priority -> days to consequence
  effort_usd: {incident: 25000, work_order: 20000, maintenance_plan: 15000, opportunity: 3000}
  weights: {production: 1.0, risk: 1.0, compliance: 1.0}

# Operating limits (#101). Alarm limits come from the DCS export and PI AF limit traits; when both give
# one, the first source here counts (the DCS is what actually alarms). A unit runs when its run signal,
# the first of its points matching one of run_signals, is at or above `above` (stopped under `below`,
# which defaults to a third of it); units without one follow the units around them (same area and train).
limits:
  priority: [dcs, pi_af]
  run_signals:
    - {uom: kW, above: 20}
    - {uom: rpm, above: 3000}
    - {uom: mm/s, above: 1.0}
    - {point: '\.CHOKE$', above: 5}
  settle_minutes: 180     # after a start, temperatures and pressures settle before limits count
  # Positions operators set get no learned range.
  not_learned: ['\.CHOKE$', 'Valve$', 'ESDV$']
