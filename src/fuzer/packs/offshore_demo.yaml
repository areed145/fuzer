# Asset pack for the fake offshore platform "OSB".
# Everything asset-specific lives here; the core code stays generic.
name: offshore_demo
facility: OSB

tag_grammar:
  area_digits: 2
  loop_digits: [3, 5]
  # ISA 5.1-style function codes used on this asset.
  function_codes: [P, V, K, E, PT, TT, LT, FT, VT, ST, PDT, FIC, LIC, PIC, TIC, XV, PSV, ZSC]

well_grammar:
  platforms: [A]

# Phrases operators use instead of tag numbers.
aliases:
  test separator: [tag, 20-V-2002]
  test sep: [tag, 20-V-2002]
  production separator: [tag, 20-V-2001]
  prod sep: [tag, 20-V-2001]
  surge drum: [tag, 27-V-2001]
  deaerator: [tag, 44-V-2001]

matching:
  equipment:
    auto_accept: 0.90
    review_min: 0.60

survivorship:
  default:
    priority: [review, sap, pi_af, pi, ec, maximo, jde, pid, oplog]
    review_on_conflict: false
  fields:
    manufacturer: {priority: [review, sap, maximo, jde], review_on_conflict: true}
    model: {priority: [review, sap, maximo, jde], review_on_conflict: true}
    description: {priority: [review, sap, pi_af, pi, ec, maximo, jde]}
    uom: {priority: [review, pi, pi_af]}

# How this asset's records map onto the equipment taxonomy. Other assets swap these rules (or
# the taxonomy) without code changes.
classification:
  taxonomy: iso14224
  # ISA 5.1 function letters on the tag -> class or class.type
  tag_functions:
    P: PU
    K: CO
    E: HE
    V: VE
    PT: IP.PR
    TT: IP.TE
    LT: IP.LE
    FT: IP.FL
    PDT: IP.DP
    ST: IP.SP
    VT: IP.VI
    FIC: CL
    LIC: CL
    PIC: CL
    TIC: CL
    XV: VA.ES
    PSV: VA.PS
    ZSC: IP
  # PI AF element template -> class.type (refines the function-letter class)
  templates:
    Centrifugal Pump: PU.CE
    Compressor: CO.CE
    Heat Exchanger: HE.ST
    Pressure Vessel: VE
  # Description words -> type, checked when the class has types (first match wins)
  description_types:
    separator: SE
    scrubber: SC
    drum: DR
    deaerator: DR
    cooler: ST
    heater: ST
  # Spellings seen in source systems -> one manufacturer name
  manufacturer_aliases:
    flowsrve: Flowserve
    sulzer pumps: Sulzer
    siemens: Siemens Energy
    alfa-laval: Alfa Laval
    bhge: Baker Hughes
    k.s.b.: KSB
  # Extra classes this asset needs beyond the taxonomy (same shape as the standards file)
  extra_classes: {}

# This site's SAP PM catalog codes -> ISO 14224 reliability codes.
maintenance_codes:
  damage:   # -> failure mode
    D01: VIB
    D02: ELP
    D03: FTS
    D04: OHE
    D05: LOO
    D06: NOI
    D07: AIR
    D08: INL
    D09: UST
    D10: BRD
  cause:    # -> failure mechanism
    C01: "2.4"
    C02: "1.2"
    C03: "2.2"
    C04: "3.3"
    C05: "5.2"
    C06: "1.3"
  activity: # -> maintenance activity
    A01: "1"
    A02: "2"
    A03: "4"
    A04: "6"
    A05: "10"

# Energy Components downtime / deferment reason codes -> name and category. "equipment" reasons
# are expected to name the equipment in the comment; other categories are not.
downtime_reasons:
  EQ-FAIL: {name: Equipment failure, category: equipment}
  PROC-TRIP: {name: Process trip, category: equipment}
  PLAN-MAINT: {name: Planned maintenance, category: planned}
  WELL-INT: {name: Well intervention, category: well}
  WEATHER: {name: Weather, category: external}
  EXPORT: {name: Export restriction, category: external}
