# SAP equipment: physical items, matched on serial number and the tag they are installed at. A motor-driven
# item carries its motor's nameplate: rated power (kW) and service factor (#515). A driven machine names its driver
# (the turbine, engine or motor turning it, by functional location): drives (P2.7).
source: sap
record_type: equipment
shape: records
dataset: sap_equipment
key: equnr
entity:
  kind: equipment
  key: {from: serial, as: serial}
  block: {from: floc, as: tag}
  fields: [description, manufacturer, model, serial, motor_rated_kw, motor_service_factor]
links:
  - rel: installed_at
    to: {kind: tag, from: floc, as: tag}
    valid_from: valid_from
    valid_to: valid_to
  - rel: drives
    when: driver
    from: {kind: tag, from: driver, as: tag}
    to: {kind: tag, from: floc, as: tag}
