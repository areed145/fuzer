# Energy Components network nodes: wells, separators / meters / headers (by tag), other nodes
# (manifolds, sales points). `site` (a functional location) says where a node physically is.
source: ec
record_type: node
shape: network
entity:
  node: {from: _row, as: ec_node}
  fields:
    - [ec_code, {from: code, keep: true}]
    - [ec_type, {from: type, keep: true}]
    - [description, name]
links:
  - rel: located_at
    when: site
    to: {from: site, as: floc}
