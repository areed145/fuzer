# Energy Components DAY001 daily reports: production figures and free-text comments.
source: ec
record_type: daily_report
shape: events
dataset: ec_day001
key: report_date
entity:
  kind: production_day
  fields:
    - report_date
    - comments
    - [timestamp, {from: _key, keep: true}]
    - [description, {template: "Daily report {_key}", keep: true}]
    - [oil_bbl, {from: oil_bbl, as: number, keep: true}]
    - [oil_potential_bbl, {from: oil_potential_bbl, as: number}]
    - [gas_mscf, {from: gas_mscf, as: number, keep: true}]
    - [water_inj_bbl, {from: water_inj_bbl, as: number, keep: true}]
    - [gas_export_mscf, {from: gas_export_mscf, as: number}]
    - [lift_gas_mscf, {from: lift_gas_mscf, as: number}]
    - [flare_mscf, {from: flare_mscf, as: number}]
    - [fuel_gas_mscf, {from: fuel_gas_mscf, as: number}]
    - [vent_mscf, {from: vent_mscf, as: number}]
links:
  - rel: reports_on
    when: facility
    to: {kind: facility, from: facility}
mentions:
  - from: comments
