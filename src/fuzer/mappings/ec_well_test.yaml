# Energy Components well tests on the test separator: oil wells report rate, water cut, GOR, lift gas and wellhead
# pressure; gas wells report gas and condensate rates instead (gas_mscfd, condensate_bbld).
source: ec
record_type: well_test
shape: events
dataset: ec_well_tests
key: test_id
entity:
  kind: well_test
  fields:
    - test_date
    - [timestamp, {from: test_date, keep: true}]
    - [oil_bbld, {from: oil_bbld, as: number}]
    - [water_cut_pct, {from: water_cut_pct, as: number}]
    - [gor_scf_bbl, {from: gor_scf_bbl, as: number}]
    - [lift_gas_mscfd, {from: lift_gas_mscfd, as: number}]
    - [whp_psig, {from: whp_psig, as: number}]
    - [gas_mscfd, {from: gas_mscfd, as: number}]
    - [condensate_bbld, {from: condensate_bbld, as: number}]
    - [description, {template: "Well test {well} {test_date}", keep: true}]
links:
  - rel: tests
    to: {kind: well, from: well, as: well}
measurements:
  of: {kind: well, from: well, as: well}
  at: test_date
  method: well test
  values:
    - {quantity: oil_rate, from: oil_bbld, unit: bbl/d}
    - {quantity: water_cut, from: water_cut_pct, unit: "%"}
    - {quantity: gor, from: gor_scf_bbl, unit: scf/bbl}
    - {quantity: lift_gas_rate, from: lift_gas_mscfd, unit: Mscf/d}
    - {quantity: wellhead_pressure, from: whp_psig, unit: psig}
    # gas wells: measured gas and condensate rates, not an oil rate and a GOR
    - {quantity: gas_rate, from: gas_mscfd, unit: Mscf/d}
    - {quantity: condensate_rate, from: condensate_bbld, unit: bbl/d}
