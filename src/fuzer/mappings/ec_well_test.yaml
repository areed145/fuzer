# Energy Components well tests on the test separator: oil wells report rate, water cut, GOR, lift gas and wellhead
# pressure; gas wells report gas and condensate rates instead (gas_ksm3d, condensate_sm3d).
source: ec
record_type: well_test
shape: events
dataset: ec_well_tests
key: test_id
entity:
  kind: well_test
  fields:
    - test_date
    - [timestamp, {from: test_date, keep: true}]
    - [oil_sm3d, {from: oil_sm3d, as: number}]
    - [water_cut_pct, {from: water_cut_pct, as: number}]
    - [gor_sm3_sm3, {from: gor_sm3_sm3, as: number}]
    - [lift_gas_ksm3d, {from: lift_gas_ksm3d, as: number}]
    - [whp_barg, {from: whp_barg, as: number}]
    - [gas_ksm3d, {from: gas_ksm3d, as: number}]
    - [condensate_sm3d, {from: condensate_sm3d, as: number}]
    - [description, {template: "Well test {well} {test_date}", keep: true}]
links:
  - rel: tests
    to: {kind: well, from: well, as: well}
measurements:
  of: {kind: well, from: well, as: well}
  at: test_date
  method: well test
  values:
    - {quantity: oil_rate, from: oil_sm3d, unit: Sm3/d}
    - {quantity: water_cut, from: water_cut_pct, unit: "%"}
    - {quantity: gor, from: gor_sm3_sm3, unit: Sm3/Sm3}
    - {quantity: lift_gas_rate, from: lift_gas_ksm3d, unit: kSm3/d}
    - {quantity: wellhead_pressure, from: whp_barg, unit: barg}
    # gas wells: measured gas and condensate rates, not an oil rate and a GOR
    - {quantity: gas_rate, from: gas_ksm3d, unit: kSm3/d}
    - {quantity: condensate_rate, from: condensate_sm3d, unit: Sm3/d}
