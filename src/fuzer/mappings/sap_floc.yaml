# SAP functional locations: the plant hierarchy (facility > area > tag, wells under areas). abc_indicator
# is SAP's ABC criticality (A highest); blank means not assessed.
source: sap
record_type: floc
shape: hierarchy
dataset: sap_floc
key: floc
entity:
  node: {from: _key, as: floc}
  fields: [description, [criticality, {from: abc_indicator}]]
links:
  - rel: part_of
    when: parent
    to: {from: parent, as: floc}
hooks: [sidetrack]
