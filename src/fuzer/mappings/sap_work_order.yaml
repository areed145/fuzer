# SAP work orders, with the site activity code as an ISO 14224 maintenance activity. status: CRTD / REL open,
# TECO done; basic_finish is the due date; revision names the turnaround (shutdown) the work is planned for.
source: sap
record_type: work_order
shape: events
dataset: sap_work_orders
key: aufnr
entity:
  kind: work_order
  fields:
    - order_type
    - start
    - finish
    - basic_finish
    - status
    - priority
    - revision
    - activity_code
    - cost
    - text
    - [description, {from: text, default: "", keep: true}]
links:
  - rel: concerns
    when: equnr
    to: {ref: "sap:equipment:{equnr}"}
  - rel: concerns
    when: floc
    to: {from: floc, as: floc}
  - rel: for_notification
    when: qmnum
    to: {kind: notification, from: qmnum}
hooks:
  - {name: iso_code, column: activity_code, catalog: activity, field: activity}
