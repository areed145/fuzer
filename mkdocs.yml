site_name: fuzer
site_description: The asset data graph for oil and gas facilities, and the agents and workflows on it.
repo_url: https://github.com/areed145/fuzer
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  logo: assets/brand/fuzer-mark-dark.svg
  favicon: assets/brand/favicon.svg
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy, content.tabs.link]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/brightness-4, name: Light mode}

extra_css: [stylesheets/brand.css]

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.tabbed: {alternate_style: true}
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links: {not_found: warn, anchors: warn, absolute_links: info, unrecognized_links: info}

nav:
  - Home: index.md
  - Start here:
      - getting-started.md
      - tour.md
      - work-map.md
      - work-sources.md
      - walkthrough.md
      - glossary.md
  - Guides by role:
      - guides/index.md
      - guides/ioc-operator.md
      - guides/field-operator.md
      - guides/engineer.md
      - guides/planner.md
      - guides/data-steward.md
      - guides/configurer.md
  - Extend:
      - extend.md
  - Design:
      - overview.md
      - system.md
      - work-routing.md
      - work-model.md
      - architecture.md
      - adapter-boundaries.md
      - stack.md
      - ui-style.md
      - data-model.md
      - sources.md
      - identity.md
      - timeseries.md
      - analyses.md
      - agents.md
      - workflow.md
      - evals.md
      - deployment.md
      - ot-security.md
      - roadmap.md
  - Reference:
      - work-types.md
      - capabilities.md
      - methods.md
      - detectors.md
      - metrics.md
      - reports.md
      - settings.md
      - cli.md
      - schema.md
      - eval-results.md
      - assistant-eval.md
