services:
  - type: web
    name: fuzer
    runtime: docker
    plan: 1c-2g
    healthCheckPath: /health
    disk:
      name: fuzer-runtime
      mountPath: /var/lib/fuzer
      sizeGB: 1
    envVars:
      - key: FUZER_DATABASE_URL
        fromDatabase:
          name: fuzer-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FUZER_AUTH_MODE
        value: microsoft
      - key: FUZER_PUBLIC_URL
        sync: false
      - key: FUZER_MICROSOFT_CLIENT_ID
        sync: false
      - key: FUZER_MICROSOFT_CLIENT_SECRET
        sync: false
      - key: FUZER_OWNER_BOOTSTRAP_TOKEN
        generateValue: true
      - key: DAGSTER_HOME
        value: /var/lib/fuzer/dagster
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FUZER_GITHUB_ISSUES_TOKEN
        sync: false
      - key: FUZER_GITHUB_ISSUES_REPO
        sync: false

databases:
  - name: fuzer-db
    databaseName: fuzer
    user: fuzer
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
