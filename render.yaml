services:
  - type: web
    name: fuzer
    runtime: docker
    plan: 1c-2g
    healthCheckPath: /health
    # No persistent disk: every bit of state is in fuzer-db, so Render deploys with zero downtime (it starts the new
    # instance, waits for /health, moves traffic, then stops the old one). A disk would force stop-then-start.
    envVars:
      - key: FUZER_DATABASE_URL
        fromDatabase:
          name: fuzer-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FUZER_AUTH_MODE
        value: microsoft
      - key: FUZER_PUBLIC_URL
        sync: false
      - key: FUZER_MICROSOFT_CLIENT_ID
        sync: false
      - key: FUZER_MICROSOFT_CLIENT_SECRET
        sync: false
      - key: FUZER_OWNER_BOOTSTRAP_TOKEN
        generateValue: true
      - key: FUZER_DEMO_TOKEN  # optional demo account for demos and automated checks; unset = off
        sync: false
      - key: DAGSTER_HOME  # only the dagster.yaml each start writes; Dagster's storage is in fuzer-db
        value: /var/lib/fuzer/dagster
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FUZER_GITHUB_ISSUES_TOKEN
        sync: false
      - key: FUZER_GITHUB_ISSUES_REPO
        sync: false
      - key: MAPKIT_TEAM_ID  # Apple MapKit JS for the maps; all three unset = free tiles (core/mapkit.py)
        sync: false
      - key: MAPKIT_KEY_ID
        sync: false
      - key: MAPKIT_PRIVATE_KEY  # the .p8 file's contents
        sync: false

databases:
  - name: fuzer-db
    databaseName: fuzer
    user: fuzer
    plan: 0.5c-1g  # 0.1 CPU was pinned at its limit by Dagster and the API (12 Nov)
    postgresMajorVersion: "16"
