services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fuzer
      POSTGRES_PASSWORD: fuzer
      POSTGRES_DB: fuzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzer"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
