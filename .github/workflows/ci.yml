name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: "Every import resolves, including the ones inside functions"
        run: uv run python scripts/check_imports.py
      - name: "Layers (#135): no module imports from a layer above its own"
        run: uv run lint-imports
      # Tests (#137) by tier; no calls to Claude: agents and readers run on recorded answers. A worker per
      # core, each with its own Postgres; a test file stays on one worker so its plant copy is built once.
      - name: "Unit tests (no database)"
        run: uv run pytest -q -rf -m unit
      - name: "Integration tests"
        run: uv run pytest -q -rf -m integration -n auto --dist loadfile
      - name: "End-to-end tests (replays, evals)"
        run: uv run pytest -q -rf -m e2e -n auto --dist loadfile
      - name: "Ops eval (#103) on the fake plant with a scripted Claude, failing under its floors"
        run: |
          uv run fakeplant demo --asset okan --seed 11 --data /tmp/okan
          FUZER_DATA_DIR=/tmp/okan uv run fuzer --pack okan eval --ops --full --since 2024-11-04T00:00 --until 2024-11-10T00:00
