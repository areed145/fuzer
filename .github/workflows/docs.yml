name: docs

# The docs site (#134): MkDocs builds docs/*.md, strict, so a broken link fails. Published to GitHub Pages
# from main once Pages is on (Settings > Pages > Source: GitHub Actions) and the repository variable DOCS_PAGES is
# true. The generated reference pages are checked against the code by the tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --only-group docs mkdocs build
      - if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
