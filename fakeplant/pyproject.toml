[project]
name = "fuzer-fakeplant"
version = "0.1.0"
description = "Fake plants for Fuzer: messy source exports, drawings, documents and answer keys"
requires-python = ">=3.12"
dependencies = [
    "fuzer",
    "pillow>=12.3,<13",
    "pyarrow>=25.0,<26",
]

[project.scripts]
fakeplant = "fakeplant.cli:main"

[tool.uv.sources]
fuzer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakeplant"]
