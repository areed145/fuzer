# How each type of work arrives on Harrier for the loop eval (P1.7c, Gate A): what brings it in, as production runs
# it, and the window where it does. Dates are relative to the day they're read, like the process model's, so the
# windows follow its events: yesterday's vapour recovery compressor trip, and its leaking 2nd stage valve.
# The keys are as in fakeplant/bundles/okan/evals/loop.yaml.
arrive:
  upset: {scan: sre, since: "today-1d 00:00", until: "today-1d 12:00"}
  machine_trip: {detector: compressor_trips, since: "today-2d 00:00", until: "today-1d 12:00"}
  machine_health: {detector: machine_health}
  iow_breach: {detector: iow_breaches, start: "today-2d 00:00", end: "today"}
  sap_notification: {source: sap_notifications}
  # The register build's own questions, open before the run (the stewards' queue holds them)
  conflicting_sources: {build: true}
  context_gap: {build: true}
  criticality_not_assessed: {build: true}
  measurement_role_to_confirm: {build: true}
  unmatched_record: {build: true}
  unmatched_records: {build: true, about: source}
  unresolved_links: {build: true, about: source}
  # Source and mapping problems: the next deliveries in the bundle's history (deliveries/)
  failed_quality_check: {deliver: deliveries/duplicate-keys, datasets: [lims_results], rebuild: true, about: source}
  mapping_drift: {deliver: deliveries/drifted-columns, datasets: [iow_register], rebuild: true, about: source}
  source_issue: {deliver: deliveries/thin-delivery, datasets: [oplogs], about: source}
  source_quality_drop: {deliver: deliveries/thin-delivery, datasets: [oplogs], rebuild: true, about: source}
  mapping_to_approve: {suggest: deliveries/new-export, about: source}
  # An operator's reading on a round, outside its limits: the VRU frame shaking above its zone
  round_finding: {round: {point: R-G1-02, value: 9.1}}
  # A mainline pump stop in the next downtime delivery that neither the operator log nor a notification mentions
  records_gap: {deliver: deliveries/unlogged-stop, datasets: [ec_downtime], rebuild: true, detector: records_gaps}
  # A revision of the smart P&ID export: area G1's alarm table disagrees with the DCS, and A1 sends a vapour line to
  # G1 that G1's sheet doesn't show
  drawing_disagreement: {deliver: deliveries/drawing-revision, datasets: [pid_sheets], rebuild: true}
  drawing_line_to_confirm: {deliver: deliveries/drawing-revision, datasets: [pid_sheets], rebuild: true}
  # Crude tank A's high-high level shutdown, still bypassed past its expiry (the bypass register)
  bypass_overdue: {detector: bypass_overdue}
  # The next alarm export: the origin surge tank's high-high level moved two days ago, and the only change record about
  # the transmitter (in the change register's first delivery) is from long before
  unrecorded_change: {deliver: deliveries/unrecorded-change, datasets: [dcs_alarms, moc_changes], incremental: true,
                      rebuild: true, detector: unrecorded_changes}
  # The utility air pressure cycling every 50 minutes for four days: a loop candidate for the engineer
  loop_candidate: {detector: loop_oscillation}
  well_test_review: {not_here: "a pipeline and terminal has no wells to test"}
  gas_lift_instability: {not_here: "a pipeline and terminal has no wells on gas lift"}
