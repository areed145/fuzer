# What each work detector should raise on Harrier, for the sweep scorer (P3.6, #844). The format is Okan's
# (fakeplant/bundles/okan/evals/detections.yaml). Harrier's history is relative to today, as its data is; the events
# are its process model's (exports/process_model.json) and its deliveries.
detectors:
  loop_oscillation:
    since: "today-90d"
    until: "today"
    every_days: 3
    events:
      - {key: "H1.PT8002", from: "today-3d", to: "today"}  # the utility air pressure cycling every 50 minutes

  alarm_performance:
    since: "today-90d"
    until: "today 23:00"  # the plant's own day: an alarm stands a day before it is a bad actor
    every_days: 3
    events:  # no flood (the terminal's 36 alarmed tags never reach 10 in 10 minutes)
      - {key: "E1.LT5001C", from: "today-9d", to: "today 23:00"}   # crude tank C's level dropping 9 points
      - {key: "A1.PDT1007", from: "today-15d", to: "today 23:00"}  # the inlet strainer's pressure drop climbing
    gates: {precision: 0.3}  # also raises G1's temperatures, standing with no injected cause

  compressor_trips:
    since: "today-90d"
    until: "today"
    every_days: 7
    events:  # the vapour recovery train G1's trips, each raised by the next run after it
      - {key: "today-77d", from: "today-77d", to: "today-67d"}
      - {key: "today-41d", from: "today-41d", to: "today-31d"}
      - {key: "today-1d", from: "today-1d", to: "today"}

  pump_trips:
    since: "today-30d"
    until: "today"
    every_days: 2
    events:
      - {key: "A1-P-1003A", from: "today-1d", to: "today"}  # the mainline pump tripping on high vibration yesterday

  machine_health:
    since: "today-90d"
    until: "today"
    every_days: 15
    events:
      - {key: "G1-K-7001", from: "today-17d", to: "today"}  # a valve leaking on throw 2

  bypass_overdue:
    since: "today-30d"
    until: "today"
    every_days: 3
    events:
      - {key: "BYP-HR-017", from: "today-30d", to: "today"}  # crude tank A's HH level shutdown, still bypassed

  # The entries below land the next delivery in Harrier's history first; what they land stays, so they come last.
  quality_drift:
    deliver: {path: deliveries/wet-crude, datasets: [lims_results], incremental: true, rebuild: true}
    since: "today-30d"
    until: "today"
    every_days: 3
    events:
      - {key: "Crude receipt", from: "today-1d", to: "today"}  # BS&W resampled three times at about 1 %

  records_gaps:
    deliver: {path: deliveries/unlogged-stop, datasets: [ec_downtime], rebuild: true}
    since: "today"
    until: "today"
    events:
      - {key: "fz-downtime", from: "today", to: "today"}  # a mainline pump stop no log entry or notification mentions

  unrecorded_changes:
    deliver: {path: deliveries/unrecorded-change, datasets: [dcs_alarms, moc_changes], incremental: true,
              rebuild: true}
    since: "today-7d"
    until: "today"
    every_days: 1
    events:
      - {key: "A1LT1001", from: "today-2d", to: "today"}  # the origin surge tank's HH level moved, no change record

  well_tests: {not_here: "a pipeline and terminal has no wells to test"}
  gas_lift_instability: {not_here: "a pipeline and terminal has no wells on gas lift"}
  flare_events: {not_here: "no flare flow is metered and no daily report states a flare volume"}
