# How each type of work arrives on Kestrel for the loop eval (P1.7c, Gate A): what brings it in, as production runs
# it, and the window where it does. Dates are relative to the day they're read, like the process model's, so the
# windows follow its events: yesterday's compressor trip on train B1, and B1-K-2001's valve leak and misfire.
# The keys are as in fakeplant/bundles/okan/evals/loop.yaml.
arrive:
  upset: {scan: sre, since: "today-1d 00:00", until: "today-1d 12:00"}
  machine_trip: {detector: compressor_trips, since: "today-2d 00:00", until: "today-1d 12:00"}
  machine_health: {detector: machine_health}
  iow_breach: {detector: iow_breaches, start: "today-2d 00:00", end: "today"}
  sap_notification: {source: sap_notifications}
  # The register build's own questions, open before the run (the stewards' queue holds them)
  conflicting_sources: {build: true}
  context_gap: {build: true}
  criticality_not_assessed: {build: true}
  measurement_role_to_confirm: {build: true}
  unmatched_record: {build: true}
  # Work about a source rather than an asset: matched to one of the project's sources
  unmatched_records: {build: true, about: source}
  unresolved_links: {build: true, about: source}
  # Source and mapping problems: the next deliveries in the bundle's history (deliveries/) land as a source's load
  # takes them, and the register build that follows every load raises what they leave behind
  failed_quality_check: {deliver: deliveries/duplicate-keys, datasets: [lims_results], rebuild: true, about: source}
  mapping_drift: {deliver: deliveries/drifted-columns, datasets: [iow_register], rebuild: true, about: source}
  source_issue: {deliver: deliveries/thin-delivery, datasets: [oplogs], about: source}  # its fill dropped on load
  source_quality_drop: {deliver: deliveries/thin-delivery, datasets: [oplogs], rebuild: true, about: source}
  mapping_to_approve: {suggest: deliveries/new-export, about: source}  # a new export: a suggested mapping
  # An operator's reading on a round, outside its limits: the compressor frame shaking above its zone
  round_finding: {round: {point: R-B1-03, value: 9.4}}
  # A stop in the next downtime delivery that neither the operator log nor a notification mentions
  records_gap: {deliver: deliveries/unlogged-stop, datasets: [ec_downtime], rebuild: true, detector: records_gaps}
  # A revision of the smart P&ID export: train B1's alarm table disagrees with the DCS, and A1 sends a fuel gas line
  # to B1 that B1's revision doesn't show
  drawing_disagreement: {deliver: deliveries/drawing-revision, datasets: [pid_sheets], rebuild: true}
  drawing_line_to_confirm: {deliver: deliveries/drawing-revision, datasets: [pid_sheets], rebuild: true}
  # The suction scrubber's high-high level trip, still bypassed past its expiry (the bypass register)
  bypass_overdue: {detector: bypass_overdue}
