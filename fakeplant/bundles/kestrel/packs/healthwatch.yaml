# A fake predictive health service for compressors (P3.8, #703): the kind of vendor condition monitoring tool an
# operator already runs. It brings no exports: it pushes its alerts, in its own JSON, to POST /hooks/healthwatch/alerts
# behind the webhook secret, and the mapping below reads them as findings. Its fixture is a day of its alerts: one on
# B1-K-2001 before yesterday's trip, and one on a machine the register doesn't know, which goes to the data steward.
fuzer_source_pack: 1
fixture: ../healthwatch
system:
  name: healthwatch
  kind: detection
  owner: ana
  enabled: true
  webhook_secret: env:KESTREL_HEALTHWATCH_HOOK
exception_types:
- name: health_alert
  label: Predictive health alert
  role: role:engineer
  audience: [ioc, field]
  description: An alert from a predictive health service on a machine it watches.
detection_providers:
- name: healthwatch
  label: HealthWatch predictive health
  type: health_alert
  key: "{alert_id}"
  refs: ["tag:{asset_tag}"]
  title: "{asset_tag}: {message}"
  severity: {from: severity, map: {critical: 1.0, high: 0.8, medium: 0.5, low: 0.2}}
  confidence: {from: probability, scale: 100}
  start: "{detected_at}"
  link: "{url}"
  items:
  - {label: Remaining useful life, from: rul_days, unit: d}
  - {label: Pattern, from: pattern}
  clear_when: {status: {in: [closed, resolved]}}
