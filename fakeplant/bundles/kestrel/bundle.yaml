# Kestrel Ridge gas plant: a second, fictional facility that proves Fuzer isn't tied to Okan (#376). It shares no
# configuration with Okan: its own pack (tag grammar with lettered train areas and 4-digit loops, well names,
# aliases, policy) and a small hand-written set of source exports that the built-in mappings load. Its historian is
# the synthetic one driven by exports/process_model.json: an inland climate, one compression train, two gas wells,
# and a compressor trip on 2026-11-06 that pinches the wells back and empties the sales gas meter.
#
#   fuzer init --bundle fakeplant/bundles/kestrel     # in a fresh database: stores the project and its pack
#   fuzer ingest && fuzer rebuild                     # FUZER_DATA_DIR=fakeplant/bundles/kestrel/exports
bundle: 1
name: kestrel
description: "Kestrel Ridge onshore gas plant (fictional): inlet separation, compression and glycol dehydration."
pack: pack.yaml
project:
  data: exports
  timeseries: synthetic
  timezone: America/Denver
