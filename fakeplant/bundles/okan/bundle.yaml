# The Okan field demo as a seed bundle (#376, P1.6). Its exports are generated by `fakeplant generate` into
# fakeplant/data/okan.
#
#   fuzer init --bundle fakeplant/bundles/okan        # in a fresh database: stores the project and its pack
#   fuzer ingest && fuzer rebuild
bundle: 1
name: okan
description: Okan field (NMA South Offshore), fictional historical data made by fakeplant.
pack: pack.yaml
project:
  data: ../../data/okan
  timeseries: synthetic
  fakeplant: {asset: okan, seed: 11}
source_packs: [packs/healthwatch.yaml]
roster: roster.yaml
operating_model: {name: standard, version: 1}
