# The Okan field demo as a seed bundle (#376). Its pack is still the packaged one in src/fuzer/packs while the
# rest of Fuzer moves to bundles; its exports are generated by `fakeplant generate` into fakeplant/data/okan.
bundle: 1
name: okan
description: Okan field (NMA South Offshore), fictional historical data made by fakeplant.
pack: ../../../src/fuzer/packs/okan.yaml
project:
  data: ../../data/okan
  timeseries: synthetic
  fakeplant: {asset: okan, seed: 11}
