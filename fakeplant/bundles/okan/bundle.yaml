# The Okan field demo as a seed bundle (#376, P1.6). Its exports are generated by `fakeplant generate` into
# fakeplant/data/okan.
#
#   fuzer init --bundle fakeplant/bundles/okan        # in a fresh database: stores the project and its pack
#   fuzer ingest && fuzer rebuild
bundle: 1
name: okan
description: Okan field (NMA South Offshore), fictional data made by fakeplant, rolled forward to today.
pack: pack.yaml
project:
  data: ../../data/okan
  timeseries: synthetic
  rolls_from: "2025-12-31"  # its exports' today: read a day later, every date moves on a day (relative_dates, #1085)
  sample_crew: true  # a sample team works the queue on today's clock (ops/sample_crew.py, #1073)
  fakeplant: {asset: okan, seed: 11}
source_packs: [packs/healthwatch.yaml]
roster: roster.yaml
schedules: [schedules/OK-TAR-2026.yaml]  # the 2026 turnaround as its planner first laid it out (P5.18)
operating_model: {name: standard, version: 1}
packs_not_applicable:  # specialist packs that can't apply to this asset (#826)
  - {pack: pipelines-commercial/pipeline-integrity, reason: its lines have no in-line inspection runs or route segments}
  - {pack: pipelines-commercial/outage-planning, reason: it loads no customer and contract register}
