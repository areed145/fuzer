# How each type of work arrives on Okan for the loop eval (P1.7c, Gate A): what brings it in, as production runs it,
# and the window of this bundle's history where it does. `fuzer eval --loop` and tests/evals/test_loop.py read it.
#
#   detector: a registered detector (fuzer.core.detectors) and its arguments, run as a schedule runs it
#   scan: sre   the window detectors through the SRE scan and its hand-off (upsets)
#   source:     a source's sync that raises its own work
#   build: true the register build's own questions, already open
#
# A routed type not listed here is raised by the loop itself and reported as synthetic.
arrive:
  upset: {scan: sre, since: "2024-11-05T00:00", until: "2024-11-05T12:00"}  # train C's carry-over
  machine_trip: {detector: compressor_trips, since: "2024-06-10T00:00", until: "2024-06-12T00:00"}  # train A
  machine_health: {detector: machine_health, until: "2024-03-05T00:00"}  # 20-K-2200B in zone D
  iow_breach: {detector: iow_breaches, start: "2025-07-12T00:00", end: "2025-07-16T00:00"}
  records_gap: {detector: records_gaps}
  sap_notification: {source: sap_notifications}
  # The register build's own questions, open before the run (the stewards' queue holds them)
  conflicting_sources: {build: true}
  context_gap: {build: true}
  criticality_not_assessed: {build: true}
  drawing_disagreement: {build: true}
  unmatched_record: {build: true}
  # Work about a source rather than an asset: matched to one of the project's sources
  unmatched_records: {build: true, about: source}
  unresolved_links: {build: true, about: source}
  # Source and mapping problems: the next deliveries in the bundle's history (deliveries/) land as a source's load
  # takes them, and the register build that follows every load raises what they leave behind
  failed_quality_check: {deliver: deliveries/duplicate-keys, datasets: [sap_work_centers], rebuild: true, about: source}
  mapping_drift: {deliver: deliveries/drifted-columns, datasets: [iow_register], rebuild: true, about: source}
  source_issue: {deliver: deliveries/thin-delivery, datasets: [moc_register], about: source}  # its fill dropped on load
  source_quality_drop: {deliver: deliveries/thin-delivery, datasets: [moc_register], rebuild: true, about: source}
  mapping_to_approve: {suggest: deliveries/new-export, about: source}  # a new export: a suggested mapping
