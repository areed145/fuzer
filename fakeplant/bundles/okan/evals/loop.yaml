# How each type of work arrives on Okan for the loop eval (P1.7c, Gate A): what brings it in, as production runs it,
# and the window of this bundle's history where it does. `fuzer eval --loop` and tests/evals/test_loop.py read it.
#
#   detector: a registered detector (fuzer.core.detectors) and its arguments, run as a schedule runs it
#   scan: sre   the window detectors through the SRE scan and its hand-off (upsets)
#   source:     a source's sync that raises its own work
#   build: true the register build's own questions, already open
#   deliver:    the next delivery in deliveries/ lands as the source's load takes it (`incremental` when the source
#               sends only the rows that changed); `rebuild` then runs the build that follows every load
#   suggest:    a new export reaches the mapping suggester
#   round:      an operator's reading on a round
#   closeout:   a case closed out contained, its follow-up sent to the operator queue (a follow_up field job)
#   readings:   Claude's recorded readings land in the readers' cache as a reader run leaves them (no model call)
#   plan: true  the integrated plan synced from its sources first, as after every register build (run last)
#   after: <type>  that type's own arrival runs first (the trip, part or permit a plan change is about)
#   about: source  work about a source rather than an asset
#   tuning:     a window detector made noisy, its cases closed as false alarms, then the tuning job (about: detector)
#   deliver:    the next delivery in deliveries/ lands as the source's load takes it (`incremental` when the source
#               sends only the rows that changed), `rebuild` then runs the build that follows every load
#   suggest:    a new export reaches the mapping suggester
#   round:      an operator's reading on a round
#   readings:   Claude's recorded readings land in the readers' cache, as a reader run leaves them (no model call)
#
# A routed type not listed here is raised by the loop itself and reported as synthetic.
arrive:
  upset: {scan: sre, since: "2024-11-05T00:00", until: "2024-11-05T12:00"}  # train C's carry-over
  machine_trip: {detector: compressor_trips, since: "2024-06-10T00:00", until: "2024-06-12T00:00"}  # train A
  machine_health: {detector: machine_health, until: "2024-03-05T00:00"}  # 20-K-2200B in zone D
  iow_breach: {detector: iow_breaches, start: "2025-07-12T00:00", end: "2025-07-16T00:00"}
  records_gap: {detector: records_gaps}
  sap_notification: {source: sap_notifications}
  routine_due: {source: routines}  # a maintenance plan's next due date (step 7)
  follow_up: {closeout: true}  # a close-out, contained, that sends its follow-up to the operator queue
  # The register build's own questions, open before the run (the stewards' queue holds them)
  conflicting_sources: {build: true}
  context_gap: {build: true}
  criticality_not_assessed: {build: true}
  drawing_disagreement: {build: true}
  unmatched_record: {build: true}
  # Work about a source rather than an asset: matched to one of the project's sources
  unmatched_records: {build: true, about: source}
  unresolved_links: {build: true, about: source}
  # Source and mapping problems: the next deliveries in the bundle's history (deliveries/) land as a source's load
  # takes them, and the register build that follows every load raises what they leave behind
  failed_quality_check: {deliver: deliveries/duplicate-keys, datasets: [sap_work_centers], rebuild: true, about: source}
  mapping_drift: {deliver: deliveries/drifted-columns, datasets: [iow_register], rebuild: true, about: source}
  source_issue: {deliver: deliveries/thin-delivery, datasets: [moc_register], about: source}  # its fill dropped on load
  source_quality_drop: {deliver: deliveries/thin-delivery, datasets: [moc_register], rebuild: true, about: source}
  mapping_to_approve: {suggest: deliveries/new-export, about: source}  # a new export: a suggested mapping
  # An operator's reading on a round, outside its limits: a bearing running hot on the export cooler
  round_finding: {round: {point: R-10-01, value: 207}}
  # A historian point's descriptor edited in PI: the build can't tell any more which temperature it is
  measurement_role_to_confirm: {deliver: deliveries/descriptor-edit, datasets: [pi_points], incremental: true, rebuild: true}
  # Claude's readings, as a reader run leaves them in its cache (deliveries/*/<cache>.json): a datasheet curve waits
  # for an engineer, and a scanned drawing that doesn't show a line its neighbour sends it waits for a steward
  curve_to_confirm: {readings: deliveries/datasheet-read}
  drawing_line_to_confirm: {readings: deliveries/drawing-read, rebuild: true}
  # The next delivery of the safeguard registers: train B's 2nd stage vibration trip still bypassed past its expiry
  bypass_overdue: {deliver: deliveries/bypass-register, datasets: [safeguard_register, safeguard_bypasses], rebuild: true,
                   detector: bypass_overdue}
  # The same delivery: that trip last proof tested 430 days ago on a 12 month interval
  proof_test_overdue: {deliver: deliveries/bypass-register, datasets: [safeguard_register, safeguard_bypasses],
                       rebuild: true, detector: proof_test_overdue}
  # The same delivery's demand log: that trip called on twice this year, designed for 0.1 a year
  safeguard_demand: {deliver: deliveries/bypass-register, datasets: [safeguard_register, safeguard_bypasses,
                     safeguard_demands], rebuild: true, detector: safeguard_demands}
  # The test separator's level limit-cycling while its level valve sticks (February 2025)
  loop_candidate: {detector: loop_oscillation, until: "2025-02-14T00:00"}
  # OK-J03-02's water breakthrough on its June 2025 test
  well_test_review: {detector: well_tests, until: "2025-06-20T00:00"}
  # A gas-lifted well heading in late December 2025: its casing pressure surging every 75 minutes
  gas_lift_instability: {detector: gas_lift_instability, until: "2025-12-20T00:00"}
  # The HP separator's produced water carrying twice the oil after OK-J03-02's June 2025 water breakthrough
  quality_drift: {detector: quality_drift, until: "2025-07-26T00:00"}
  # A day of heavy flaring in November 2025 that no downtime, log entry or detection explains: its cause unknown
  flare_event: {detector: flare_events, until: "2025-11-09T00:00"}
  # 20-K-2300A's trip of June 2025 floods the alarm system: one case with the points that drove it
  alarm_flood: {detector: alarm_performance, until: "2025-06-25T00:00"}
  # The PP test separator's level alarming over and over while its level valve sticks (February 2025)
  alarm_bad_actor: {detector: alarm_performance, until: "2025-02-12T00:00"}
  # The next alarm export: train B's 2nd stage vibration high-high moved two days ago, and the only change record
  # about the probe (in the change register's first delivery) is from long before
  unrecorded_change: {deliver: deliveries/unrecorded-change, datasets: [dcs_alarms, moc_changes], incremental: true,
                      rebuild: true, detector: unrecorded_changes}
  # The same delivery's change register: a temporary gauge on train B's 2nd stage discharge, four days past its end
  temporary_moc_overdue: {deliver: deliveries/unrecorded-change, datasets: [dcs_alarms, moc_changes], incremental: true,
                          rebuild: true, detector: temporary_moc_overdue}
  # A difference from the standard the ops lead named a year ago, whose review date has passed (P8.2)
  deviation_review_due: {deviation: {part: settings, key: handover.shift_times, owner: ops_lead, review_by: "today-1d",
                                     reason: "The night crew's handover moved to 19:00 while the camp bus ran late"},
                         detector: deviation_reviews, about: model}
  # The compression pack's briefs not followed twice: its specialist drafts a change to the playbook (P6.4c)
  skill_change: {skill: maintenance-integrity/compression, about: skill}
  # 20-K-2300A's dry gas seal vent leaking in three LDAR surveys running (the LDAR source pack's detector)
  repeat_leak: {detector: repeat_leaks}
  # The GGCP fuel gas meter reading zero from 15 September 2025: the gas balance open by the fuel those days
  gas_balance_gap: {detector: gas_balance_gaps, now: "2025-10-01"}
  # Steps made noisy: what it then raises that it would not at its usual value is closed as false alarms, and the
  # tuning job proposes a quieter value (P6.3)
  detector_tuning: {tuning: {detector: steps, value: 2.0, since: "2024-11-04T00:00", until: "2024-11-04T12:00"}, about: detector}
  # The month's flare and emissions report drafted from its records, its review work for the HSE specialist (P7.6)
  regulatory_report: {report: flare_emissions_monthly, about: report}
  # The monthly flaring return coming due in 5 days with no report started: the calendar raises it (P7.6c)
  report_due: {obligation: {name: flaring_return, template: flare_emissions_monthly, regulator: the regulator}, about: report}
  # The agentic watch in live mode proposes what no rule raised, raised for a person to triage (P3.11d)
  watch_finding: {watch: live, since: "2024-03-08T00:00", until: "2024-03-09T00:00"}  # 20-K-2200B before its trip
  # The inspection pack's own work (P3.12): OK-PL-005's wall loss leaves it under five years to retirement, and four
  # vessels' inspection plans are past their next date
  inspection_due: {detector: inspection_findings}
  ili_anomaly: {not_here: "no in-line inspection export: its lines are surveyed by thickness readings, not pig runs"}
  # The materials records' own work (P3.13): a part on order five days after its job needs it, and parts short with
  # nothing on order and no time to get them
  parts_not_ready: {detector: parts_not_ready}
  # The permit to work system's own work (P3.14): every fourth permit lapsed two days ago, not closed, its isolations still applied
  permit_lapsed: {detector: permit_lapsed}
  # The messages to the IOC (P2.8), read after the register is built: a radio call or a mail naming a tag becomes a
  # case about it, and one that could be about any of several separators waits for the steward. Read once, so the
  # second of the two types finds what the read left open
  message_report: {source: messages, build: true}
  message_to_match: {source: messages, build: true}
  # Re-planning (P5.21): with the plan from its sources, the part on order five days late holds its order's job until
  # it arrives: a plan change for the planner, the job moved and the constraint behind it
  plan_change: {plan: true, after: parts_not_ready, detector: plan_changes}
